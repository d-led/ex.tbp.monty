# @package experiment.config.monty_config.learning_modules
# The tutorial's surface module, twice: one copy per patch.
#
# The copies differ in one thing only — the sensor their tolerances and feature
# weights name — because that is how a module is told which stream is its own.
# Nothing here makes one a parent of the other: `2lm_2sm_voting` wires both to
# the agent and lets them vote, which is the arrangement Jeff's proposal would
# replace with a schedule rather than a static matrix.
learning_module_0:
  _target_: tbp.monty.frameworks.models.evidence_matching.learning_module.EvidenceGraphLM
  max_match_distance: 0.01 # = 1cm
  tolerances:
    patch:
      hsv: ${np.array:[0.1, 0.2, 0.2]}
      principal_curvatures_log:
        - 1
        - 1
  feature_weights:
    patch:
      hsv: ${np.array:[2, 0.5, 0.5]}
  x_percent_threshold: 20
  evidence_threshold_config: 80%
  gsg:
    _target_: tbp.monty.frameworks.models.goal_generation.EvidenceGoalGenerator
    goal_tolerances:
      location: 0.015
    min_post_goal_success_steps: 5
  hypotheses_updater_args:
    max_nneighbors: 10

learning_module_1:
  _target_: tbp.monty.frameworks.models.evidence_matching.learning_module.EvidenceGraphLM
  max_match_distance: 0.01 # = 1cm
  tolerances:
    patch_side:
      hsv: ${np.array:[0.1, 0.2, 0.2]}
      principal_curvatures_log:
        - 1
        - 1
  feature_weights:
    patch_side:
      hsv: ${np.array:[2, 0.5, 0.5]}
  x_percent_threshold: 20
  evidence_threshold_config: 80%
  gsg:
    _target_: tbp.monty.frameworks.models.goal_generation.EvidenceGoalGenerator
    goal_tolerances:
      location: 0.015
    min_post_goal_success_steps: 5
  hypotheses_updater_args:
    max_nneighbors: 10
