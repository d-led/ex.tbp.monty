# @package _global_
# Two learning modules on one object, learning at the same time, with no parent
# between them.
#
# The question is the one the Thousand Brains "shared distributed learning"
# discussion (2026-11-19) asks, in the only form this code can answer today:
# can one run teach two modules at once from two views of the same surface, and
# does the library come back with both modules' memories in it? Oscillating
# parent/child roles and hippocampal-style replay have no config key and no
# implementation upstream, so they are not what this tests — the static matrix
# is the thing under test, and it is exactly the "fixed dividing line" the
# proposal wants gone.
#
# Everything is the CAD set's own working pieces: the plate world with a second
# patch, the three-sensor clip, the training interface, the one-epoch supervised
# pretraining shape that `cad/plate_pretrain` measured working. What is ours is
# the module pair and the connectivity. The borrowed groups are named here on
# purpose — this set does not copy them.
defaults:
  - /monty: evidencegraph_exp1000_emin_t3
  # A training module has no goal to give, so Monty's surface policy stands
  # still; the naive scan sweeps the sphere and asks for nothing (measured on
  # `cad/plate_pretrain`).
  - /monty/motor_system_config: naive_scan_5
  - /monty/learning_module: evidence_2lm_tutorial
  - /monty/sensor_module: camera_tutorial_surf_agent_2patches
  - /monty/connectivity: 2lm_2sm_voting
  - /environment: cad_plate_objects_2patch
  - /env_interface: cad_plate_train
  - /env_interface/transform: missing_depthto3d_sensor3_semantic0_clip
  - /termination: any1_objectrecognition_t1000_e500_tot5000
  - /logging: basic_info_monty_runs
  - /telemetry: info

experiment:
  _target_: tbp.monty.frameworks.experiments.pretraining_experiments.MontySupervisedObjectPretrainingExperiment
  config:
    show_sensor_output: true
    n_train_epochs: 1
    n_eval_epochs: 0
    # Nothing to start from: this is where a memory comes from.
    model_name_or_path: ""
    seed: 42
    # Both modules are named, and that is not decoration: a module the
    # experiment does not name has its hypotheses wiped before the write, so its
    # memory is never updated — an unnamed second module would learn nothing and
    # the run would look like a success.
    supervised_lm_ids:
      - learning_module_0
      - learning_module_1
    python_log_level: DEBUG
    logging:
      output_dir: ${path.expanduser:${oc.env:MONTY_LIBRARIES}}
      run_name: sharing_plate_two_columns
      wandb_group: gm_pretrain_runs
