# @package _global_
# Two learning modules on one object, learning at the same time, with no parent
# between them — on Monty's own working ground.
#
# Every piece here is Monty's, from `tutorial/dist_agent_5lm_2obj_train`: the
# same five-sensor distant agent, the same two YCB objects, the same naive scan,
# the same 307-step episode, the same displacement modules. Two things are ours:
# the module pair (`displacement_2lm` — two copies, one per patch) and the
# connectivity (`2lm_2sm_dist` — each module on its own patch, votes and nothing
# else). One thing is smaller: a single training epoch instead of one per
# rotation, so the run is a look rather than a corpus.
#
# Why not the CAD world: a 300-step cap there taught four and five nodes, because
# a surface patch on a flat part passes almost nothing through its delta filter.
# A world that produces a real memory is the only place a "did both modules
# learn" question can be answered.
defaults:
  - /monty: graph
  - /monty/motor_system_config: naive_scan_5
  - /monty/learning_module: displacement_2lm
  # Monty's own: five patches on a distant agent. Patches 2–4 mount and feed no
  # module, exactly as the view finder does.
  - /monty/sensor_module: 5sm_camera
  - /monty/connectivity: 2lm_2sm_dist
  - /environment: mujoco_dist_agent_sensors5
  - /env_interface: tutorial_train_2obj_predefined
  - /env_interface/positioning_procedures_train: getgoodview_viewfinder_patch0
  - /env_interface/transform: missing_depthto3d_sensor6
  - /termination: any1_any_mfgm_t3e3exp500_naivescan_fixed5_tot6000
  - /logging: silent_warning_train
  - /telemetry: info

experiment:
  _target_: tbp.monty.frameworks.experiments.pretraining_experiments.MontySupervisedObjectPretrainingExperiment
  config:
    n_train_epochs: 1
    n_eval_epochs: 3 # unused but required, as in the tutorial
    model_name_or_path: ''
    seed: 42
    show_sensor_output: true
    # Both modules are named, and that is not decoration: a module the
    # experiment does not name has its hypotheses wiped before the write, so its
    # memory is never updated — an unnamed second module would learn nothing and
    # the run would look like a success.
    supervised_lm_ids:
      - learning_module_0
      - learning_module_1
    logging:
      output_dir: ${path.expanduser:${oc.env:MONTY_LIBRARIES}}
      run_name: sharing_dist_two_columns
