# @package experiment.config

# The unsupervised counterpart: the same objects, a random rotation per episode.
# Five, because the corpus carries five — the three untextured scans are excluded
# in `objaverse_dogs.json`, with the measurement that excluded each one.
do_train: true
train_env_interface_args:
  object_names:
    - milka
    - dog_free_fire
    - kinder_guard_dog
    - puppy
    - dogs_head
  object_init_sampler:
    _target_: tbp.monty.frameworks.environments.object_init_samplers.RandomRotation
train_env_interface_class: ${monty.class:tbp.monty.experiment.environment.OneObjectPerEpisodeInterface}
