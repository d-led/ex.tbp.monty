# @package _global_

# Monty's `supervised_pre_training_base`, on the dog corpus: the same modules,
# motor system, termination and logging, with the environment and the object
# list swapped. Supervised pretraining is the experiment that hands the model
# the answer while it explores, so this is the cheapest memory the corpus can
# produce — the baseline the unsupervised runs are read against.
defaults:
  - /monty: graph
  - /monty/motor_system_config: naive_scan_5
  - /monty/learning_module: displacement_delta_d0001
  - /monty/sensor_module: camera_dist_raw0
  - /monty/connectivity: 1lm_1sm
  - /environment: mujoco_objaverse_dogs_dist_agent
  - /env_interface: train_dogs_predefined
  - /env_interface/positioning_procedures_train: getgoodview_viewfinder_patch
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0
  - /termination: any1_any_mfgm_t3e3exp500_naivescan_fixed5_tot6000
  - /logging: silent_info_train

experiment:
  _target_: tbp.monty.frameworks.experiments.pretraining_experiments.MontySupervisedObjectPretrainingExperiment
  config:
    show_sensor_output: false
    n_train_epochs: ${constants.rotations_all_count}
    n_eval_epochs: 3
    model_name_or_path: ''
    seed: 42
    supervised_lm_ids: all
    logging:
      run_name: dogs_supervised_pretraining

# This experiment **trains only** (`Setup.epoch_plan/1` answers `[train: N]`
# from Monty's own `train_distinctobj_predefined`); recognition against the
# memory it writes is `dogs/inference`.
