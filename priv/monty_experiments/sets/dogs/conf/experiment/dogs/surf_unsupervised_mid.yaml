# @package _global_

# `dogs/surf_unsupervised` with three training epochs: an unsupervised memory is
# as complete as the number of views it was built from, and Monty's own config
# takes ten. Three is the smallest number that gives each dog more than one
# rotation, which is what makes a *pose* identifiable and not only an object.
defaults:
  - /monty: graph
  - /monty/motor_system_config: surface
  - /monty/learning_module: evidence_1lm_nn5_dogs
  - /monty/sensor_module: camera_surf
  - /monty/connectivity: 1lm_1sm
  - /environment: mujoco_objaverse_dogs_surf_agent
  - /env_interface: train_dogs_random
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0_clip
  - /termination: any1_min_mfgm_t100e3exp1000_maxt4000e500tot4000
  - /logging: basic_warning_monty_runs

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: false
    n_train_epochs: 3
    n_eval_epochs: 1
    model_name_or_path: ""
    seed: 42
    supervised_lm_ids: []
    python_log_level: DEBUG
    logging:
      run_name: dogs_surf_unsupervised_mid

# This experiment **trains only** — three epochs, which is the smallest number
# that gives each dog more than one rotation. Recognition is `dogs/inference`.
