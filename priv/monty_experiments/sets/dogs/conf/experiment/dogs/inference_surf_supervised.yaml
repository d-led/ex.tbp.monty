# @package _global_

# `dogs/inference_paired` over the memory `dogs/surf_supervised` writes: the same
# world, agent, module and budget, with `model_name_or_path` pointed at the
# supervised surface memory. The only thing that differs is the memory — and this
# one is scorable, because supervised pretraining keeps each graph under the dog's
# own id, so a `match` can be compared to the dog that was placed (`docs/training.md`
# §9).
defaults:
  - /monty: evidencegraph
  - /monty/motor_system_config: surface_curvature_informed_goal1
  - /monty/learning_module: evidence_tutorial_surf_agent_2obj
  - /monty/sensor_module: camera_surf_noise_raw0
  - /monty/connectivity: 1lm_1sm
  - /environment: mujoco_objaverse_dogs_surf_agent
  - /env_interface: eval_dogs_random
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0_clip
  - /termination: any1_any_mfgm_t3ecexp1000_t1000e500tot5000
  - /logging: basic_warning_monty_runs

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: false
    n_train_epochs: 0
    model_name_or_path: ${constants.pretrained_dir}/trained/dogs_surf_supervised/pretrained/
    n_eval_epochs: 10
    seed: 42
    supervised_lm_ids: []
    python_log_level: DEBUG
    logging:
      run_name: dogs_inference_surf_supervised
