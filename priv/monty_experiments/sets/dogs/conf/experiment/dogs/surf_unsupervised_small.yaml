# @package _global_

# `dogs/surf_unsupervised` with one training epoch and one recognition epoch:
# the experiment that can be read end to end in one sitting. The training phase
# is what an `--episodes` slice cannot shorten for you, because the slice runs
# the train episodes first.
defaults:
  - /monty: graph_exp1000_e3_t100
  - /monty/motor_system_config: surface
  - /monty/learning_module: evidence_1lm_nn5
  - /monty/sensor_module: camera_surf
  - /monty/connectivity: 1lm_1sm
  - /environment: mujoco_objaverse_dogs_surf_agent
  - /env_interface: train_dogs_random
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0_clip
  - /termination: any1_min_e3_t100_exp1000_max_e500_t4000_tot4000
  - /logging: basic_warning_monty_runs

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: false
    n_train_epochs: 1
    n_eval_epochs: 1
    model_name_or_path: ""
    seed: 42
    supervised_lm_ids: []
    python_log_level: DEBUG
    logging:
      run_name: dogs_surf_unsupervised_small

# This experiment **trains only** — one epoch. It has no evaluation phase, so an
# episode that ends in `no_match` is a training episode that could not match the
# graph it was building, not a recognition that failed.
