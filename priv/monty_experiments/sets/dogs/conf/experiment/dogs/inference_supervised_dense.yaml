# @package _global_

# `dogs/inference_supervised`, over the finer-scan memory instead: the same world,
# module, budget and agent, with `model_name_or_path` pointed at what
# `dogs/supervised_pretraining_dense` writes. The only thing that differs from
# that config is the memory, so the two runs' verdicts are one comparison.
defaults:
  - /monty: evidencegraph
  - /monty/motor_system_config: distant_5
  - /monty/learning_module: evidence_tutorial_surf_agent_2obj
  - /monty/sensor_module: camera_dist_noise_raw0
  - /monty/connectivity: 1lm_1sm
  - /environment: mujoco_objaverse_dogs_dist_agent
  - /env_interface: eval_dogs_random
  - /env_interface/positioning_procedures_eval: getgoodview_viewfinder_patch
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0
  - /termination: any1_any_mfgm_t3ecexp1000_t1000e500tot5000
  - /logging: basic_warning_wandb_monty_runs

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: false
    n_train_epochs: 0
    model_name_or_path: ${constants.pretrained_dir}/trained/dogs_supervised_pretraining_dense/pretrained/
    n_eval_epochs: 10
    seed: 42
    supervised_lm_ids: []
    python_log_level: DEBUG
    logging:
      run_name: dogs_inference_supervised_dense
