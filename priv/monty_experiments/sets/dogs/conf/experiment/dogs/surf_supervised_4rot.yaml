# @package _global_

# `dogs/surf_supervised` at four rotations instead of two: the same world, agent,
# modules and budget, `n_train_epochs: 4`. The question is what the extra rotations
# buy — the two-rotation memory already concludes all eight dogs and names seven,
# so this run either closes the eighth name or shows that the miss is not a
# coverage problem.
defaults:
  - /monty: graph
  - /monty/motor_system_config: surface_curvature_informed_5_goal0
  - /monty/learning_module: graph_1lm
  - /monty/sensor_module: camera_surf_rgba
  - /monty/connectivity: 1lm_1sm
  - /environment: mujoco_objaverse_dogs_surf_agent
  - /env_interface: train_dogs_predefined
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0_clip
  - /termination: any1_any_mfgm_t3e3exp500_steplimit_maxt500e500tot6000
  - /logging: silent_warning_train

experiment:
  _target_: tbp.monty.frameworks.experiments.pretraining_experiments.MontySupervisedObjectPretrainingExperiment
  config:
    show_sensor_output: false
    # Thirty-two episodes, about twenty-five minutes on this machine.
    n_train_epochs: 4
    n_eval_epochs: 3
    model_name_or_path: ''
    seed: 42
    supervised_lm_ids: all
    logging:
      run_name: dogs_surf_supervised_4rot

# Trains only. Recognition against the memory it writes is
# `dogs/inference_surf_supervised_4rot`.
