# @package _global_

# The control arm of `dogs/inference_dist`: the same world, module, budget and
# agent, reading the 5° memory `dogs/supervised_pretraining` builds instead of the
# 3° one the arm itself reads.
#
# It is what the density measurement is against — three of the five dogs named
# here against five of five there, because a graph of this corpus meets a 5° raster
# in a dozen places a rotation (`docs/training.md` §10) — and nothing else about it
# differs.
defaults:
  - /monty: noresetevidencegraph
  - /monty/motor_system_config: distant_5
  - /monty/learning_module: noresetevidence_1lm
  - /monty/sensor_module: camera_dist_noise_raw0
  - /monty/connectivity: 1lm_1sm
  - /environment: mujoco_objaverse_dogs_dist_agent
  - /env_interface: eval_dogs_random
  - /env_interface/positioning_procedures_eval: getgoodview_viewfinder_patch
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0
  - /termination: any1_min_mfgm_t3e100exp1000_maxt1000e100tot6000
  - /logging: basic_warning_monty_runs

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: false
    n_train_epochs: 0
    model_name_or_path: ${constants.pretrained_dir}/trained/dogs_supervised_pretraining/pretrained/
    n_eval_epochs: 10
    seed: 42
    supervised_lm_ids: []
    python_log_level: DEBUG
    logging:
      run_name: dogs_inference_dist_raster
