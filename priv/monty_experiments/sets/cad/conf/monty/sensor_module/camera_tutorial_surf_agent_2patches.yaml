# @package experiment.config.monty_config.sensor_modules
# The tutorial's surface sensor, twice: `patch` and `patch_side` are the same
# CameraSM reading the same object from two points of the agent's own frame, and
# the view finder is third so that the two patches are indices 0 and 1 in
# `sm_to_lm_matrix`. Everything each module reports is the tutorial's own set and
# thresholds — the pair is the experiment, not the module.

sensor_module_0:
  _target_: tbp.monty.frameworks.models.sensor_modules.CameraSM
  sensor_module_id: patch
  features:
  - pose_vectors
  - pose_fully_defined
  - on_object
  - object_coverage
  - min_depth
  - mean_depth
  - hsv
  - principal_curvatures
  - principal_curvatures_log
  save_raw_obs: false
  delta_thresholds:
    on_object: 0
    n_steps: 20
    hsv:
    - 0.1
    - 0.1
    - 0.1
    pose_vectors: ${np.list_eval:[np.pi / 4, np.pi * 2, np.pi * 2]}
    principal_curvatures_log:
    - 2
    - 2
    distance: 0.01
  is_surface_sm: true
  noise_params:
    features:
      pose_vectors: 2
      hsv: ${np.array:[0.1, 0.2, 0.2]}
      principal_curvatures_log: 0.1
      pose_fully_defined: 0.01
    location: 0.002

sensor_module_1:
  _target_: tbp.monty.frameworks.models.sensor_modules.CameraSM
  sensor_module_id: patch_side
  features:
  - pose_vectors
  - pose_fully_defined
  - on_object
  - object_coverage
  - min_depth
  - mean_depth
  - hsv
  - principal_curvatures
  - principal_curvatures_log
  save_raw_obs: false
  delta_thresholds:
    on_object: 0
    n_steps: 20
    hsv:
    - 0.1
    - 0.1
    - 0.1
    pose_vectors: ${np.list_eval:[np.pi / 4, np.pi * 2, np.pi * 2]}
    principal_curvatures_log:
    - 2
    - 2
    distance: 0.01
  is_surface_sm: true
  noise_params:
    features:
      pose_vectors: 2
      hsv: ${np.array:[0.1, 0.2, 0.2]}
      principal_curvatures_log: 0.1
      pose_fully_defined: 0.01
    location: 0.002

sensor_module_2:
  _target_: tbp.monty.experiment.sensor_module.ExperimentSensorModule
  sensor_module_id: view_finder
  sensor_id: view_finder
  transforms: []
