# @package experiment.config.monty_config.learning_modules
# The tutorial's evidence LM for a surface agent, reading two patches. Both ids
# need their own tolerances and weights: a module's `tolerances` and
# `feature_weights` are keyed by the sensor module that reported the features,
# so a second patch with no entry is a channel the module cannot judge.

learning_module_0:
  _target_: tbp.monty.frameworks.models.evidence_matching.learning_module.EvidenceGraphLM
  max_match_distance: 0.01
  tolerances:
    patch:
      hsv: ${np.array:[0.1, 0.2, 0.2]}
      principal_curvatures_log:
      - 1
      - 1
    patch_side:
      hsv: ${np.array:[0.1, 0.2, 0.2]}
      principal_curvatures_log:
      - 1
      - 1
  feature_weights:
    patch:
      hsv: ${np.array:[2, 0.5, 0.5]}
    patch_side:
      hsv: ${np.array:[2, 0.5, 0.5]}
  x_percent_threshold: 20
  evidence_threshold_config: 80%
  gsg:
    _target_: tbp.monty.frameworks.models.goal_generation.EvidenceGoalGenerator
    goal_tolerances:
      location: 0.015
    min_post_goal_success_steps: 5
  hypotheses_updater_args:
    max_nneighbors: 10
