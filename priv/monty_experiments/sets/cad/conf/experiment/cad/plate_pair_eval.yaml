# @package _global_
# The plate as two plates: an object that is an arrangement, recognised as that
# arrangement.
#
# Every other CAD run asks about one part — as a lump, as its features, or as one
# member of a set. This one asks the question Monty's compositional objects ask:
# can a graph of a *thing made of things* be matched, rather than the things. The
# memory is one object (`plate_pair_assembly`) taught from the two placed
# instances the world names; the world is that same arrangement meshed as one
# object. Nothing else differs from `plate_part_eval` — same module, same sensor,
# same policy, same termination — so a difference in the numbers is the
# arrangement and not the machinery.
defaults:
  - /monty: evidencegraph_exp1000_emin_t3
  - /monty/motor_system_config: surface_curvature_informed_goal1
  - /monty/learning_module: evidence_tutorial_surf_agent_2obj
  - /monty/sensor_module: camera_tutorial_surf_agent_2obj
  - /monty/connectivity: 1lm_1sm
  - /environment: cad_plate_pair_objects
  - /env_interface: cad_plate_pair_eval
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0_clip
  - /termination: any1_objectrecognition_t1000_e500_tot5000
  - /logging: basic_info_monty_runs
  - /telemetry: info

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: true
    n_train_epochs: 3
    # The memory of the arrangement, under the release the build teaches into.
    model_name_or_path: ${path.expanduser:${oc.env:MONTY_LIBRARIES}}/cad_parts_v1/plate_pair_assembly
    n_eval_epochs: 3
    seed: 42
    supervised_lm_ids: []
    python_log_level: DEBUG
    logging:
      output_dir: ${path.expanduser:${oc.env:MONTY_LIBRARIES}}
      run_name: cad_plate_pair_eval
      wandb_group: gm_eval_runs
