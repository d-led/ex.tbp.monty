# @package _global_
# A CAD part, recognised in a mesh world by a memory taught on its B-rep.
#
# The name says what the run is, because nothing else will: `blend-big` is the part,
# `part` is what the memory labels a face with (the whole part, as opposed to one
# object per feature), and `eval` is the phase. This is ours, so it does not wear
# Monty's clothes — a run of ours may not be filed under a name a reader would
# take for one of Monty's own experiments.
#
# The memory is the one the CAD pipeline writes: `<libraries>/cad_parts_v1/
# blend-big_part.jsonl.gz`, a release and a name of our own for the same reason.
defaults:
  - /monty: evidencegraph
  - /monty/motor_system_config: surface_curvature_informed_goal1
  - /monty/learning_module: evidence_tutorial_surf_agent_2obj
  - /monty/sensor_module: camera_tutorial_surf_agent_2obj
  - /monty/connectivity: 1lm_1sm
  - /environment: cad_plate_objects
  - /env_interface: cad_blend-big_eval
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0_clip
  - /termination: any1_any_mfgm_t3ecexp1000_t1000e500tot5000
  - /logging: basic_info_monty_runs
  - /telemetry: info

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: true
    n_train_epochs: 3
    # Where the memory of the part lives. The tail after the libraries root is
    # what must match: `<libraries>/cad_parts_v1/blend-big_part.jsonl.gz`.
    model_name_or_path: ${path.expanduser:${oc.env:MONTY_LIBRARIES}}/cad_parts_v1/blend-big_part
    n_eval_epochs: 3
    seed: 42
    supervised_lm_ids: []
    python_log_level: DEBUG
    logging:
      output_dir: ${path.expanduser:${oc.env:MONTY_LIBRARIES}}
      run_name: cad_blend-big_part_eval
      wandb_group: gm_eval_runs
