# @package _global_
# A CAD part, recognised in a mesh world by a memory taught on its B-rep.
#
# The name says what the run is, because nothing else will: `blend` is the part,
# `part` is what the memory labels a face with (the whole part, as opposed to one
# object per feature), and `eval` is the phase. This is ours, so it does not wear
# Monty's clothes — a run of ours may not be filed under a name a reader would
# take for one of Monty's own experiments.
#
# The memory is the one the CAD pipeline writes: `<libraries>/cad_parts_v1/
# blend_part.jsonl.gz`, a release and a name of our own for the same reason.
defaults:
  - /monty: evidencegraph
  - /monty/motor_system_config: surface_curvature_informed_goal1
  - /monty/learning_module: evidence_tutorial_surf_agent_2obj
  - /monty/sensor_module: camera_tutorial_surf_agent_2obj
  - /monty/connectivity: 1lm_1sm
  - /environment: cad_plate_objects
  - /env_interface: cad_blend_eval
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0_clip
  - /termination: any1_any_mfgm_t3ecexp1000_t1000e500tot5000
  - /logging: basic_info_monty_runs
  - /telemetry: info

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    # The stand-off and the gait are sizes, not constants, and this part is
    # small: forty by thirty by twenty millimetres, against the surface policy's
    # own twenty-five millimetres off and four-millimetre step.
    #
    # Measured on this Mac in the compiled scene, one episode: at the policy's
    # own numbers the patch's depth is the far value on most steps, the module is
    # fed background, its evidence falls from 8.5 to nought through mismatch and
    # the episode concludes "no match". At eight millimetres off — the closest the
    # compiled scene renders (`plate_features_eval.yaml` has that measurement) —
    # and a two-millimetre step the episode concludes in 178 steps with `blend`
    # correct at evidence 22.9. Both halves read one surface, because
    # `Monty.Studio.Cad.Preparation` teaches the memory from this same stand-off.
    monty_config:
      motor_system_config:
        policy_selector:
          policy:
            desired_object_distance: 0.008
            action_sampler:
              rotation_degrees: 2.0
              translation_distance: 0.002
    show_sensor_output: true
    show_sensor_output: true
    n_train_epochs: 3
    # Where the memory of the part lives. The tail after the libraries root is
    # what must match: `<libraries>/cad_parts_v1/blend_part.jsonl.gz`.
    model_name_or_path: ${path.expanduser:${oc.env:MONTY_LIBRARIES}}/cad_parts_v1/blend_part
    n_eval_epochs: 3
    seed: 42
    supervised_lm_ids: []
    python_log_level: DEBUG
    logging:
      output_dir: ${path.expanduser:${oc.env:MONTY_LIBRARIES}}
      run_name: cad_blend_part_eval
      wandb_group: gm_eval_runs
