# @package _global_
# A CAD part learned from its own percepts, in a mesh world, by supervised
# pretraining: one episode per rotation of `plate`, no memory to match against,
# and a memory written at the end of the epoch.
#
# This is the other half of `plate_part_eval`: that run recognises a memory the
# B-rep teacher wrote, this one writes a memory from what the sensor saw. Two
# things had to differ from the evaluation config, and both were measured.
#
# The module is the evaluation run's on purpose. A training episode begins by
# matching — Monty's order: the model starts in its matching step, the training
# termination answers `no_match`, and that is what names the new object — so the
# module must be one with a matching scheme. `/monty: graph_exp500_e3_t3` hard-
# codes the bare `GraphLM` pairing, which cannot be one.
#
# The motor policy is Monty's naive scan rather than the surface policy the
# evaluation run uses: that one asks the module for a goal, and a training module
# has none to give, so it stood still — four hundred steps of `goals 0` and
# `inputs 0`, and a memory with no nodes. The naive scan sweeps the view sphere
# and asks for nothing.
defaults:
  - /monty: evidencegraph_exp1000_emin_t3
  - /monty/motor_system_config: naive_scan_5
  - /monty/learning_module: evidence_tutorial_surf_agent_2obj
  - /monty/sensor_module: camera_tutorial_surf_agent_2obj
  - /monty/connectivity: 1lm_1sm
  - /environment: cad_plate_objects
  - /env_interface: cad_plate_train
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0_clip
  - /termination: any1_objectrecognition_t1000_e500_tot5000
  - /logging: basic_info_monty_runs
  - /telemetry: info

experiment:
  _target_: tbp.monty.frameworks.experiments.pretraining_experiments.MontySupervisedObjectPretrainingExperiment
  config:
    show_sensor_output: true
    n_train_epochs: 1
    n_eval_epochs: 0
    # Nothing to start from: this is where a memory comes from. The pipeline
    # writes the result beside the taught memories, under our own release name.
    model_name_or_path: ""
    seed: 42
    # Which modules this episode teaches. It is not decoration: a module the
    # experiment does not name has its hypotheses wiped before the write
    # (`_pass_target_info_to_model`'s else-branch), so its memory is never
    # updated — a config with an empty list trains nothing at all, which is what
    # four hundred steps of a part reported before this line was right.
    supervised_lm_ids:
      - learning_module_0
    python_log_level: DEBUG
    logging:
      output_dir: ${path.expanduser:${oc.env:MONTY_LIBRARIES}}
      run_name: cad_plate_pretrain
      wandb_group: gm_pretrain_runs
