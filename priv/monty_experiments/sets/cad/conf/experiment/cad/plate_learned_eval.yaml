# @package _global_
# The part the sensor taught itself, recognised from that memory.
#
# `plate_part_eval` asks whether a run can find a part from a memory the B-rep
# teacher wrote; this asks whether it can find it from a memory a training run
# wrote — the second half of "make a memory, then use it", and the only run that
# closes the loop. Everything else is the evaluation config's on purpose: same
# world, same sensor, same module, same policy. What differs is where the memory
# comes from, which is the whole question.
defaults:
  - /monty: evidencegraph_exp1000_emin_t3
  - /monty/motor_system_config: surface_curvature_informed_goal1
  - /monty/learning_module: evidence_tutorial_surf_agent_2obj
  - /monty/sensor_module: camera_tutorial_surf_agent_2obj
  - /monty/connectivity: 1lm_1sm
  - /environment: cad_plate_objects
  - /env_interface: cad_plate_eval
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0_clip
  - /termination: any1_objectrecognition_t1000_e500_tot5000
  - /logging: basic_info_monty_runs
  - /telemetry: info

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: true
    n_train_epochs: 3
    # The memory `cad/plate_pretrain` writes: the library the run leaves under
    # `trained/`, not the teacher's under `cad_parts_v1/`. The tail after the
    # libraries root is what must match.
    model_name_or_path: ${path.expanduser:${oc.env:MONTY_LIBRARIES}}/trained/cad_plate_pretrain
    n_eval_epochs: 3
    seed: 42
    supervised_lm_ids: []
    python_log_level: DEBUG
    logging:
      output_dir: ${path.expanduser:${oc.env:MONTY_LIBRARIES}}
      run_name: cad_plate_learned_eval
      wandb_group: gm_eval_runs
