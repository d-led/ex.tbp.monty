# @package _global_
# A CAD part's features, recognised in a mesh world by a memory taught on the
# same part's B-rep.
#
# The name says what the run is: `plate` is the part, `features` is what the
# memory holds — one object per feature the plate is made of, rather than the
# whole part as one lump — and `eval` is the phase. Its sibling `plate_part_eval`
# asks the same question about the part as a whole; the difference between the
# two runs is the question, not the geometry.
#
# The memory is `<libraries>/cad_parts_v1/plate_features.jsonl.gz`, written by
# the CAD build from the same STEP file the objects are meshed from, and the
# object set is `<data>/cad_objects/plate_bosses_0` and its three neighbours —
# the same names the memory answers with.
defaults:
  - /monty: evidencegraph
  # The part's sibling run steps a 6 cm plate and takes Monty's 2 cm surface
  # steps; a feature is a centimetre across, and with those steps the patch
  # leaves it by step nine and the evidence never moves again. This is Monty's
  # own small-step policy — the same class, 5 mm steps and 5° turns — pointed at
  # the smaller object.
  - /monty/motor_system_config: surface_curvature_informed_goal1
  - /monty/learning_module: evidence_tutorial_surf_agent_2obj
  - /monty/sensor_module: camera_tutorial_surf_agent_2obj
  - /monty/connectivity: 1lm_1sm
  - /environment: cad_plate_objects
  - /env_interface: cad_plate_features_eval
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0_clip
  - /termination: any1_any_mfgm_t3ecexp1000_t1000e500tot5000
  - /logging: basic_info_monty_runs
  - /telemetry: info

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: true
    n_train_epochs: 3
    # The patch is twice the stand-off wide, so the distance fixes two sizes at
    # once: too near and the patch reads background rather than a centimetre
    # feature, too far and it spans more than the feature does. 8 mm reads
    # 1.6 mm of surface. Twice that reads a bore properly — the plate's bore is
    # ten millimetres deep, and at 8 mm its far opening makes the surface fit
    # answer a thin arc, so 21 of the bore's 96 visits keep a curvature against
    # 96 of 96 at 16 mm — and it costs every episode: twelve episodes score 7
    # match here and 3 in `plate_features_2patch_eval` at 16 mm against 8 and
    # 11 at 8 mm. A faithful bore is worth less than a patch that fits inside a
    # boss.
    #
    # The memory is taught from the same distance as the run
    # (`Monty.Studio.Cad.Preparation`), because a memory photographed from a
    # different distance is a memory of a different surface.
    monty_config:
      motor_system_config:
        policy_selector:
          policy:
            desired_object_distance: 0.008
            # A gait is a size too. The surface policy's sampler steps four
            # millimetres and turns five degrees, which is a quarter of a
            # centimetre feature: a crossing is two or three steps and the rest
            # of an episode is the policy walking back, measured as the module
            # being fed on 56 to 625 of 5000 steps. One millimetre and one
            # degree keep the same arc per turn — 0.8 mm a degree — at the
            # feature's own size, and `ConstantSampler` is where both numbers
            # live. One sampler for every feature the part is made of: this is
            # the same kind of choice as the stand-off above, not a treatment of
            # any one shape.
            action_sampler:
              rotation_degrees: 1.0
              translation_distance: 0.001
    # Where the memory of the part's features lives. The tail after the
    # libraries root is what must match: `<libraries>/cad_parts_v1/plate_features
    # .jsonl.gz`.
    model_name_or_path: ${path.expanduser:${oc.env:MONTY_LIBRARIES}}/cad_parts_v1/plate_features
    n_eval_epochs: 3
    seed: 42
    supervised_lm_ids: []
    python_log_level: DEBUG
    logging:
      output_dir: ${path.expanduser:${oc.env:MONTY_LIBRARIES}}
      run_name: cad_plate_features_eval
      wandb_group: gm_eval_runs
