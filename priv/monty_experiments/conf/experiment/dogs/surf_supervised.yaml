# @package _global_

# Monty's `surf_agent_1lm_2obj_train` — the surface agent with the answer handed
# to it — on the dog corpus: the same modules, motor system, termination and
# logging, with the environment and the object list swapped.
#
# Why this pairing. The dist agent's supervised memory of these eight dogs
# recognises eight of eight and names five correctly (`docs/training.md` §7), and
# the three misses are the three thinnest graphs: a 5° naive scan meets a dog of
# this corpus in a dozen places per rotation, so `dog_free_fire` came out of
# fourteen episodes with 124 nodes against `milka`'s 1 109. The surface agent is
# the policy that walks an object instead of a raster, and it is the policy the
# tutorial's memory recognises six of six with. Supervised, because the graph
# keeps the object's own id and a verdict can then be scored against the dog that
# was placed.
defaults:
  - /monty: graph_exp500_e3_t3
  - /monty/motor_system_config: surface_curvature_informed_5_goal0
  - /monty/learning_module: graph_1lm
  - /monty/sensor_module: camera_surf_rgba
  - /monty/connectivity: 1lm_1sm
  - /environment: mujoco_objaverse_dogs_surf_agent
  - /env_interface: train_dogs_predefined
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0_clip
  - /termination: any1_train_steps_3_500_tot6000
  - /logging: silent_warning_train

experiment:
  _target_: tbp.monty.frameworks.experiments.pretraining_experiments.MontySupervisedObjectPretrainingExperiment
  config:
    show_sensor_output: false
    # Two rotations of the corpus, not the fourteen `rotations_all_count` holds:
    # an episode of this agent is ~3 300 steps, so 8 dogs × 14 rotations is 112
    # episodes and about five hours on this machine, against thirteen minutes for
    # the sixteen measured here (`docs/training.md`). Two rotations already leave
    # 7 217 nodes over the eight dogs and seven of eight names recognised.
    n_train_epochs: 2
    n_eval_epochs: 3
    model_name_or_path: ''
    seed: 42
    supervised_lm_ids: all
    logging:
      run_name: dogs_surf_supervised

# This experiment **trains only**. Recognition against the memory it writes is
# `dogs/inference_paired` with `model_name_or_path` pointed at
# `trained/dogs_surf_supervised/pretrained/`.
