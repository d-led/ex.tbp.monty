# @package _global_

# The supervised pretraining, with one training epoch and one evaluation epoch:
# the same experiment as `dogs/supervised_pretraining`, small enough to watch
# end to end. `--episodes` slices the run's episode list, and the list is train
# first — so a run that wants to *see* a recognition has to keep the training
# phase short rather than cut the list.
defaults:
  - /monty: graph_exp500_e3_t3
  - /monty/motor_system_config: naive_scan_5
  - /monty/learning_module: displacement_delta_d0001
  - /monty/sensor_module: camera_dist_raw0
  - /monty/connectivity: 1lm_1sm
  - /environment: mujoco_objaverse_dogs_dist_agent
  - /env_interface: train_dogs_predefined
  - /env_interface/positioning_procedures_train: getgoodview_viewfinder_patch
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0
  - /termination: any1_naivescan_fixed5_tot6000
  - /logging: silent_info_train

experiment:
  _target_: tbp.monty.frameworks.experiments.pretraining_experiments.MontySupervisedObjectPretrainingExperiment
  config:
    show_sensor_output: false
    n_train_epochs: 1
    n_eval_epochs: 1
    model_name_or_path: ''
    seed: 42
    supervised_lm_ids: all
    logging:
      run_name: dogs_supervised_pretraining_small

# This experiment **trains only** — one epoch, so the graph it builds can be watched
# in a minute. It has no evaluation phase; recognition is `dogs/inference`.
