# @package _global_

# Recognition against the memory supervised pretraining built — `dogs/supervised_pretraining`,
# fourteen rotations of the corpus — with the learning module and the budget
# `tutorial/surf_agent_2obj_eval` uses, which is the inference this port has
# measured working (six of six `match`, 599 steps).
#
# Why not `dogs/inference`'s module: `noresetevidence_1lm` reads every hypothesis
# (`evidence_threshold_config: all`) and cuts an episode at a hundred matching
# steps. Over a dog memory it narrows to one object and evidence 78 and then
# stops there, because a `match` also needs the *pose* to resolve
# (`EvidenceGraphLM.get_unique_pose_if_available`): the possible hypotheses have
# to cluster around one location and one rotation. This module culls to the top
# 80 % first (`evidence_threshold_config: 80%`, `max_nneighbors: 10`) and the
# budget below allows 500 evaluation steps, which is what the same memory needs.
#
# A distant agent, because `dogs/supervised_pretraining` scans with
# `naive_scan_5` on `DistantAgent` at 0.2 m and `camera_dist_raw0`.
defaults:
  - /monty: evidencegraph_exp1000_emin_t3
  - /monty/motor_system_config: distant_5
  - /monty/learning_module: evidence_tutorial_surf_agent_2obj
  - /monty/sensor_module: camera_dist_noise_raw0
  - /monty/connectivity: 1lm_1sm
  - /environment: mujoco_objaverse_dogs_dist_agent
  - /env_interface: eval_dogs_random
  - /env_interface/positioning_procedures_eval: getgoodview_viewfinder_patch
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0
  - /termination: any1_objectrecognition_t1000_e500_tot5000
  - /logging: basic_warning_wandb_monty_runs

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: false
    n_train_epochs: 0
    model_name_or_path: ${constants.pretrained_dir}/trained/dogs_supervised_pretraining/pretrained/
    n_eval_epochs: 10
    seed: 42
    supervised_lm_ids: []
    python_log_level: DEBUG
    logging:
      run_name: dogs_inference_supervised
