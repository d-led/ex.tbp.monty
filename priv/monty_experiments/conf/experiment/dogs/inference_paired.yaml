# @package _global_

# Recognition against the surface agent's own memory, with the learning module and
# the budget that this port has measured recognising (`tutorial/surf_agent_2obj_eval`).
#
# Why not `dogs/inference`: that one copies Monty's
# `unsupervised_inference_distinctobj_surf_agent`, whose module reads every
# hypothesis (`evidence_threshold_config: all`) and whose policy cuts an episode
# at a hundred matching steps. Over a dog memory it narrows to one object and the
# evidence climbs, but a `match` also needs the *pose* to resolve
# (`EvidenceGraphLM.get_unique_pose_if_available`), and the surviving hypotheses
# never cluster into one location and one rotation inside that budget. This module
# culls to the top 80 % (`evidence_threshold_config: 80%`, `max_nneighbors: 10`)
# and the policy below allows five hundred evaluation steps, which is what the
# same memory needs.
defaults:
  - /monty: evidencegraph_exp1000_emin_t3
  - /monty/motor_system_config: surface_curvature_informed_goal1
  - /monty/learning_module: evidence_tutorial_surf_agent_2obj
  - /monty/sensor_module: camera_surf_noise_raw0
  - /monty/connectivity: 1lm_1sm
  - /environment: mujoco_objaverse_dogs_surf_agent
  - /env_interface: eval_dogs_random
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0_clip
  - /termination: any1_objectrecognition_t1000_e500_tot5000
  - /logging: basic_warning_monty_runs

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: false
    n_train_epochs: 0
    model_name_or_path: ${constants.pretrained_dir}/trained/dogs_surf_unsupervised/pretrained/
    n_eval_epochs: 10
    seed: 42
    supervised_lm_ids: []
    python_log_level: DEBUG
    logging:
      run_name: dogs_inference_paired
