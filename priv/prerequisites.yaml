  - id: pretrained_compositional_objects_v10
    title: Pretrained compositional object models (v10)
    description: >
      The models Monty's cows configurations name since #1280, unpacked into
      ~/tbp/results/monty/pretrained_models/pretrained_compositional_objects_v10.
    url: https://tbp-pretrained-models-public-c9c24aef2e49b897.s3.us-east-2.amazonaws.com/tbp.monty/pretrained_compositional_objects_v10.tgz
    sha256: 470c050a6477587f66dc68dd976d768109ca82be3ee27718863f794a4fe7158a
    upstream: thousandbrainsproject/tbp.monty, release pretrained_compositional_objects_v10
    licence: MIT, as Monty itself — the models are its training's output
    root: MONTY_MODELS
    target: pretrained_compositional_objects_v10.tgz
    extract: true
    unpacks_to: pretrained_compositional_objects_v10
    provides:
