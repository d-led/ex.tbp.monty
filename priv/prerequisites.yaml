    url: https://tbp-pretrained-models-public-c9c24aef2e49b897.s3.us-east-2.amazonaws.com/tbp.monty/pretrained_compositional_objects_v8.tgz
    sha256: 6e6c761cb2279d42fd9ac0c8bc945a3fd27136dea323a58a422a84d92097c7ab
    upstream: thousandbrainsproject/tbp.monty, release pretrained_compositional_objects_v8
    licence: MIT, as Monty itself — the models are its training's output
    root: MONTY_MODELS
    target: pretrained_compositional_objects_v8.tgz
    extract: true
    unpacks_to: pretrained_compositional_objects_v8
    provides:
