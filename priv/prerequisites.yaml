# What an experiment needs before it can run.
#
# THIS FILE IS THE ONE PLACE. Every archive this application knows about is an
# entry here, with its URL here: nothing else in the source names one. Adding a
# prerequisite is an edit to this list — an `id`, a `title`, a `url`, the `root`
# it belongs under and a `target` under that root — and then it appears on
# `/prerequisites`, is fetched by a boot that finds it unfinished, and is
# reported by the saga like every other entry. `test/monty/prerequisites_test.exs`
# holds the shape of an entry, so a typo fails there rather than at a person's
# first download.
#
# `root` names the environment variable Monty itself uses, and `target` is
# relative to it — the same places `docs/how-to-use-monty/getting-started.md`
# tells a Python user to put these files:
#
#   MONTY_DATA    ~/tbp/data
#   MONTY_MODELS  ~/tbp/results/monty/pretrained_models
#   MONTY_LOGS    ~/tbp/results/monty/projects
#
# Entries are downloaded by /prerequisites in the UI, streamed to
# `<target>.part` and moved into place only when the bytes and checksum match.
# An entry that is an archive unpacks where it lands and is not finished until
# its memory has been exported — see `Monty.Prerequisites.Saga` for the phases
# and `Monty.Prerequisites.Record` for what is remembered between starts.
prerequisites:


  # The object meshes a MuJoCo run renders. Monty's getting-started guide names
  # this archive and this place; the tag goes in `ycb/` itself, which is where
  # `${MONTY_DATA}/mujoco/objects/ycb` (the data_path every MuJoCo environment
  # config names) looks.
  - id: ycb_objects_1_0
    title: YCB object meshes
    description: >
      The 77 YCB objects Monty renders in MuJoCo, unpacked into
      ~/tbp/data/mujoco/objects/ycb.
    url: https://tbp-data-public-5e789bd48e75350c.s3.us-east-2.amazonaws.com/tbp.monty/ycb_objects_1.0.tgz
    root: MONTY_DATA
    target: mujoco/objects/ycb/ycb_objects_1.0.tgz
    extract: true
    # The archive's name is not the directory it fills.
    unpacks_to: mujoco/objects/ycb

  # The release Monty's current configs name (`constants.pretrained_dir`), which
  # is the one a run of `base_10simobj_surf_agent` and its siblings loads.
  - id: pretrained_ycb_v14
    title: Pretrained YCB models (v14)
    description: >
      The pretrained models Monty's current configs name, unpacked into
      ~/tbp/results/monty/pretrained_models/pretrained_ycb_v14.
    url: https://tbp-pretrained-models-public-c9c24aef2e49b897.s3.us-east-2.amazonaws.com/tbp.monty/pretrained_ycb_v14.tgz
    root: MONTY_MODELS
    target: pretrained_ycb_v14.tgz
    extract: true
    unpacks_to: pretrained_ycb_v14

  # Not what a run needs: the recorded episodes in `test/fixtures` were made
  # with this release (docs/validation.md), so replaying them — the parity tests
  # that hold the port to Monty's own conclusions — reads this memory and no
  # other. A page that offered it without saying so would be asking a person to
  # download two hundred megabytes for no reason.
  - id: pretrained_ycb_v10
    title: Pretrained YCB models (v10)
    description: >
      The release the recorded episodes in this repository were made with. A
      run does not need it; replaying those episodes against Monty's own
      conclusions does.
    url: https://tbp-pretrained-models-public-c9c24aef2e49b897.s3.us-east-2.amazonaws.com/tbp.monty/pretrained_ycb_v10.tgz
    root: MONTY_MODELS
    target: pretrained_ycb_v10.tgz
    extract: true
    unpacks_to: pretrained_ycb_v10

  # The compositional objects Monty's cows benchmarks step — the 3-D primitives
  # with stickers that the family recognises a composition of. Two archives: the
  # 19 objects of `cows_small` and the 119 of `cows_large`, and `random_locs`
  # for the evaluation of the large set (docs/overview/benchmark-experiments.md
  # in Monty's own tree names both).
  - id: compositional_objects_1_4_mujoco
    title: Compositional objects (COWS small and large)
    description: >
      The 19 and 119 compositional objects the cows family steps, unpacked into
      ~/tbp/data/compositional_objects_1.4_mujoco. One and a half gigabytes.
    url: https://tbp-data-public-5e789bd48e75350c.s3.us-east-2.amazonaws.com/tbp.monty/compositional_objects_1.4_mujoco.tgz
    root: MONTY_DATA
    target: compositional_objects_1.4_mujoco.tgz
    extract: true
    unpacks_to: compositional_objects_1.4_mujoco

  - id: compositional_objects_1_4_random_locs_mujoco
    title: Compositional objects, random locations
    description: >
      The extra episodes a `random_locs` cows evaluation steps, unpacked into
      ~/tbp/data/compositional_objects_1.4_random_locs_mujoco.
    url: https://tbp-data-public-5e789bd48e75350c.s3.us-east-2.amazonaws.com/tbp.monty/compositional_objects_1.4_random_locs_mujoco.tgz
    root: MONTY_DATA
    target: compositional_objects_1.4_random_locs_mujoco.tgz
    extract: true
    unpacks_to: compositional_objects_1.4_random_locs_mujoco

  # The release the cows configurations' `constants.compositional_pretrained_dir`
  # names (`…/pretrained_compositional_objects_v8`). Thirty-one megabytes, and
  # without it all eighteen cows configurations are refused for want of a memory.
  - id: pretrained_compositional_objects_v8
    title: Pretrained compositional object models (v8)
    description: >
      The models the cows family's configurations load, unpacked into
      ~/tbp/results/monty/pretrained_models/pretrained_compositional_objects_v8.
    url: https://tbp-pretrained-models-public-c9c24aef2e49b897.s3.us-east-2.amazonaws.com/tbp.monty/pretrained_compositional_objects_v8.tgz
    root: MONTY_MODELS
    target: pretrained_compositional_objects_v8.tgz
    extract: true
    unpacks_to: pretrained_compositional_objects_v8
