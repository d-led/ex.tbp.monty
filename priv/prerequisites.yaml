      - supervised_pre_training_cows_small_compositional
      - supervised_pre_training_cows_small_monolithic

  # The inputs that are not downloads.
  #
  # Two of the things a run reads are outputs of code this application carries,
  # so their entry names the work instead of a url: `Monty.Prerequisites.Build`
  # runs it in the same machine a download goes through, with the same row, the
  # same progress and the same Cancel. A boot never starts one — a build is
  # minutes of this machine's work and only a person asks for it.
  #
  # The CAD memory is what a B-rep run recognises with and the meshes are what
  # the same part looks like to a MuJoCo camera; the entry is one name for both,
  # because a run has neither a graph to match against nor a surface to look at
  # unless both are written.
  - id: cad_part_memories
    title: CAD part memories and meshes
    description: >
      One memory and one object set per CAD part this application's configurations
      name, taught and meshed from the STEP file it ships: the memories in the
      libraries folder, the meshes in `cad_objects` under this application's data
      folder. A recognition run of a part has nothing to compare against without
      them.
    build: cad_part_memories
    upstream: ex_monty_cad (Hex) reads the B-rep; the parts are this application's own STEP files
    licence: the STEP sources ship with this application; the geometry is ex_quiddity's (MPL-2.0)
    root: MONTY_LIBRARIES
    target: cad_parts_v1
    extract: true
    unpacks_to: cad_parts_v1
    # The memories one Make writes. Without this a config that loads one is told
    # that no archive carries it and no experiment trains it — true of archives
    # and of trainings, false here, and it leaves a reader with no click. Read
    # off the CAD experiments this application ships
    # (`priv/monty_experiments/sets/cad`), which name one memory each and where
    # two runs may name the same file.
    provides:
      - plate_part
      - plate_features
      - blend_part
      - blend-big_part
      # `cad/parts_set_eval` — one memory holding two parts, taught from the
      # objects that experiment names.
      - parts_set
      # `cad/plate_pair_eval` — one object that is an arrangement: the plate
      # twice, placed as that experiment's world says.
      - plate_pair_assembly
    # The other half of what one Make writes: the meshes each memory was taught
    # on, beside the world's objects. A run reads the memory *and* the meshes,
    # so a machine missing either is missing this build — and the objects folder
    # is what `for_path/1` has to answer with when a CAD world has nothing in it.
    writes:
      - root: MONTY_DATA
        target: cad_objects

  # The dogs' object set, imported from Objaverse's own GLBs. The manifest beside
  # the experiments says which eight dogs, with author, licence and page for
  # each; this entry is the import, and the GLBs are cached under downloads/ so a
  # second run fetches nothing.
  - id: objaverse_dogs
    title: Objaverse dogs (object set)
    description: >
      The eight scanned dogs the corpus experiments step, imported from Objaverse
      1.0 into ~/tbp/data/mujoco/objects/objaverse_dogs. Each is CC-BY, and the
      attribution travels with the object set.
    build: objaverse_dogs
    upstream: allenai/objaverse on HuggingFace; each model's author and page are in the set's ATTRIBUTION.md
    licence: CC-BY, per model
    root: MONTY_DATA
    target: mujoco/objects/objaverse_dogs
    extract: true
    unpacks_to: mujoco/objects/objaverse_dogs
