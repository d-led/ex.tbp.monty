    url: https://tbp-data-public-5e789bd48e75350c.s3.us-east-2.amazonaws.com/tbp.monty/compositional_objects_1.4_mujoco.tgz
    sha256: 80cbb9626b34d2aa24b9530c12fceecb403179162bd218d8fefe97c0c01f7755
    upstream: thousandbrainsproject/tbp.monty, compositional_objects_1.4
    licence: published by the Thousand Brains Project with Monty (MIT)
    root: MONTY_DATA
