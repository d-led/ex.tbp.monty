# @package _global_
# Stage 3: the memory a CAD run wrote, read by a run whose world is a mesh.
#
# It is the tutorial's two-object evaluation with three things changed — the
# world (a CAD part's own mesh, `mujoco_cad_objects`), the object (the part the
# memory holds, `cad_eval_one_object`) and where the memory is read from. The
# motor system, the learning module, the sensor module and the connectivity are
# the tutorial's, because the question is what the *world* costs, not what a
# different agent buys.
defaults:
  - /monty: evidencegraph_exp1000_emin_t3
  - /monty/motor_system_config: surface_curvature_informed_goal1
  - /monty/learning_module: evidence_tutorial_surf_agent_2obj
  - /monty/sensor_module: camera_tutorial_surf_agent_2obj
  - /monty/connectivity: 1lm_1sm
  - /environment: mujoco_cad_objects
  - /env_interface: cad_eval_one_object
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0_clip
  - /termination: any1_objectrecognition_t1000_e500_tot5000
  - /logging: basic_info_monty_runs
  - /telemetry: info

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: true
    # Three rotations of the one object.
    n_train_epochs: 3
    # The memory a CAD run wrote. `mix run scripts/cad_mesh_eval.exs` puts the
    # libraries directory in front of this path, so the tail is what must match:
    # `<libraries dir>/pretrained_ycb_v14/surf_agent_1lm_10distinctobj.jsonl.gz`.
    model_name_or_path: ${path.expanduser:"~/tbp/results/monty/projects"}/pretrained_ycb_v14/surf_agent_1lm_10distinctobj
    n_eval_epochs: 3
    seed: 42
    supervised_lm_ids: []
    python_log_level: DEBUG
    logging:
      output_dir: ${path.expanduser:"~/tbp/results/monty/projects"}
      run_name: cad_mesh_eval
      wandb_group: gm_eval_runs
