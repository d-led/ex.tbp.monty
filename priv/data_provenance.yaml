  # This port's own experiments. They are authored here, so their provenance is
  # the commit that wrote them; the hash is here so that a change to a config
  # someone forgot about still shows up as a change to the data a run reads.
  - path: priv/monty_experiments/sets
    kind: written
    title: this port's own experiments, as Hydra sets
    licence: MPL-2.0
    # `cad/blend_part_eval` names its own stand-off and gait (2026-11-19): the
    # blend is 40×30×20 mm and the surface policy's 25 mm / 4 mm step reads the
    # far plane on most steps, so the part is taught and stepped from 8 mm with a
    # 2 mm/2° gait. The reasons are in that config and in `docs/cad.md`.
    #
    # `cad/parts_set_eval` with `env_interface/cad_parts_set_eval` is the same
    # day's second change: one memory of several parts, taught from the parts the
    # experiment names, so a run can ask whether it recognises the part it is
    # shown rather than its own single object.
    #
    # `cad/plate_pretrain` is the learning arm: the same part, the same world and
    # a memory with nothing in it, one supervised episode per rotation. Three
    # things in it were each measured — the evidence module rather than a bare
    # graph module, Monty's naive scan rather than the goal-driven surface policy
    # (which stood still), and `supervised_lm_ids` naming the module (an empty
    # list trains nothing, because the experiment wipes every unnamed module's
    # hypotheses before the write). `docs/cad.md` carries the measurements.
    #
    # `cad/plate_learned_eval` closes the loop: the evaluation config's world,
    # sensor and policy, and the memory `plate_pretrain` wrote under `trained/`
    # instead of the teacher's under `cad_parts_v1/`. One episode matched in 80
    # steps with 10 goals, which is a run recognising a part from percepts it
    # taught itself.
    # `cad/plate_pair_eval` is the arrangement arm: one object made of two
    # instances of the plate, 60 mm apart, with the world's `assembly` list as the
    # single source for both the memory and the mesh. It recognises all three of
    # its episodes, and a probe sees the match at step 80, by symmetry.
    #
    # The feature arms read a feature from 8 mm: the patch is twice the stand-off
    # wide, so 16 mm reads the bore properly and reads a patch wider than a boss.
    # `sets/cad/README.md` carries the table and the twelve-episode result either
    # way.
    #
    # `sets/sharing` is the first experiment that is not a CAD arm: two learning
    # modules on two patches of the same object, learning in one run with no
    # parent between them (`sharing/dist_two_columns`). Its first version
    # borrowed the CAD plate world and was the wrong ground — a 300-step cap
    # there stored 4 and 5 nodes, because a surface patch on a flat part passes
    # almost nothing through its delta filter. It now stands on Monty's own
    # `tutorial/dist_agent_5lm_2obj_train` groups and adds only the module pair
    # and the connectivity; two 307-step episodes stored 11 and 13 nodes, the
    # range naive scanning gives. It exists to test, as far as a config can, the
    # "shared distributed learning" question from the Thousand Brains discussion
    # of 2026-11-19 — `sets/sharing/README.md` says what it asks and what would
    # falsify it.
    #
    # The dogs interfaces name the corpus's five objects (2026-11-20): three of
    # Objaverse's eight are excluded in `sets/dogs/objaverse_dogs.json`, each
    # with the measurement that excluded it, and a config that still named one
    # failed a training run forty minutes in with "unknown object type".
    # `test/monty/prerequisites/corpus_test.exs` holds the two files together.
    #
    # The dogs training arm carries its own learning-module group
    # (`sets/dogs/conf/monty/learning_module/evidence_1lm_nn5_dogs.yaml`): a
    # model grid is an absolute box centred on the first touch, Monty's 0.3 m is
    # a mug's size, and a dog normalised to 10 cm tall is 25–35 cm long, so the
    # graph was refused for 90 % of its observations not fitting. It is Monty's
    # module with a 0.6 m box over 100 voxels — the same 6 mm voxel.
    # `docs/monty-differences.md` §2.43 carries the measurements.
    #
    # The dogs inference arm reads the 3° memory from 2026-11-23: over the 5° one
    # the unsupervised module names three of the five dogs and over the 3° one
    # five of five, so `inference_dist` moved to it and the 5° arm kept its
    # comparison under `inference_dist_raster`. `docs/training.md` §10 has the
    # two verdicts and the head-removal control that ruled the corpus out.
    #
    # `sets/live` is the device arm (2026-11-24): one experiment,
    # `live/novel_object_unsupervised`, the run a streamed RGBD/LiDAR capture
    # will step. Its memory is empty, so the object is novel, and three training
    # epochs follow before three that only evaluate — which is what gives the
    # studio's open-ended run and its training switch both directions to take.
    # `_unsupervised` is Monty's word for a run with nothing pretrained behind
    # it. Its streamed counterpart becomes
    # `live/novel_object_from_stream_unsupervised` when the camera world lands,
    # following `world_image_from_stream_on_scanned_model`. It lives here rather
    # than in `priv/monty/`, because `mix monty.inputs` deletes every YAML in
    # that mirror which Monty does not ship.
    #
    # Re-hashed on the v0.60.0 catch-up (2026-11-26), which the record above was
    # not re-written for: 27 of our configs named recognition-strategy and
    # termination groups the pull retired (`graph_exp500_e3_t3`,
    # `graph_exp1000_e3_t100`, `evidencegraph_exp1000_emin_t3`,
    # `noresetevidencegraph_exp1000_e100_t3`, and the `*_t3e3exp*` / `*_t100e3exp*`
    # / `*_t3e100exp*` termination groups), and the tests re-pointed at the ones
    # that survived. No other file under `sets/` changed.
    hash: 8c0d8e16ca52e7f385aa3ce1e71cdce5cd9d62c6d002c498191eb9f1061eadd9

  # One termination group of ours: the union of `monty/graph_exp500_e3_t3` with
  # Monty's `any1_train_steps_3_500_tot6000`, written because v0.60.0 moved the
  # step-type numbers out of `monty_config` and no shipped group carries this
  # pair. Our own config, so its history is the repository's.
  - path: priv/monty_experiments/conf/termination/any1_any_mfgm_t3e3exp500_steplimit_maxt500e500tot6000.yaml
    kind: written
    title: the step limit our supervised pretraining reads
    hash: 54a59bffdfc2604ce5f3350249d8860d5b7ef1e0e862258901c9738074215ebb

