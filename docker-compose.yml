# Postgres and Adminer for a development checkout. The application runs on this
# machine, not here:
#
#   docker compose up -d
#   scripts/init-dev.sh
#   scripts/run-dev.sh          # http://localhost:4000
#
# The ports are this project's own — `DB_PORT` (6432) and `ADMINER_PORT` (6433) —
# so a second project's database on 5432 is never mistaken for this one.
# `config/runtime.exs` reads `DB_PORT`, so nothing has to be exported.

services:
  postgres:
    image: postgres:17
    ports:
      - "${DB_PORT:-6432}:5432"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - data-postgres:/var/lib/postgresql/data

  # http://localhost:6433/?pgsql=postgres&username=postgres&db=postgres&ns=public
  adminer:
    image: adminer:latest
    links:
      - postgres
    ports:
      - "${ADMINER_PORT:-6433}:8080"

volumes:
  data-postgres:

