# The published image and a Postgres of its own:
#
#   docker compose up
#
# Then http://localhost:4001. What a run writes lives in containers and goes
# with `docker compose down`; what `/prerequisites` downloads survives it, in a
# volume of its own, so the next `up` does not fetch it again.
#
# `TAG=v1.2.3 docker compose up` runs a release instead of `:latest`; the tags
# are in docs/container.md, which also has every variable the image reads.

name: ex-tbp-monty

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: monty
      POSTGRES_USER: monty
      POSTGRES_PASSWORD: monty
    healthcheck:
      test: pg_isready -U monty -d monty
      interval: 2s

  # Once per `up`: the migration a deploy runs, before the server starts, so the
  # release never boots against a schema it does not know.
  migrate:
    image: &image ghcr.io/d-led/ex.tbp.monty:${TAG:-latest}
    entrypoint: ["/app/bin/migrate"]
    environment: &environment
      DATABASE_URL: ecto://monty:monty@db:5432/monty
      # Not a secret: this is a local look, and the same for everybody.
      SECRET_KEY_BASE: local-look-only-2f8d1c6a9e4b7d0f3a6c9e2b5d8f1a4c7e0b3d6f9a2c5e8b1d4f7a0c3e6b9d2f5a8c1e4b7d0f3a6c9e2b5d8f1a4c7e0b3d6f9a2c5e8b
    depends_on:
      db:
        condition: service_healthy

  app:
    image: *image
    ports:
      - 4001:4000
    environment:
      <<: *environment
      PHX_HOST: localhost
    volumes:
      # `~/tbp` inside the container: the datasets and model bundles
      # `/prerequisites` downloads. Named, so they outlive `docker compose down`.
      - prerequisites:/app/priv/tbp
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  prerequisites:
