name: ci

# The gates a change has to pass before it lands, and the image that comes out
# of the ones that passed:
#
#   lint   compile --warnings-as-errors, formatting, credo --strict, sobelow.
#          Fails fastest.
#   test   Postgres, the suite with coverage — split four ways, because it is
#          seven minutes fifty of an eight-minute run — and the two parity
#          oracles (Monty's config snapshots and the module map) against a real
#          Monty checkout.
#   report what the partitions cannot answer alone: their coverage merged and
#          held to the 85% threshold, the CRAP ranking over that total, and the
#          parity oracles.
#   types  dialyzer, against a PLT the cache carries between runs.
#   image  one build per architecture, each on a runner of its own
#          architecture — amd64 also runs Trivy on the result and starts it as
#          uid 10001 — and a last job that makes the tags from the two digests:
#          `:main` (and `:latest`) for main, `:<branch>` for any other branch,
#          `:v1.2.3` for a release tag. Never a commit hash — the image already
#          carries its commit in `priv/build_info.json`, which the footer shows.
#          They wait for the three gates above (`needs`), so nothing is
#          published from a commit that failed them.
#
# Why two builds rather than one: compiled under QEMU on an x86 runner, the
# arm64 half took twenty-two minutes where the amd64 half took five, for the
# same work. Each pushes its manifest by digest, and `image index` makes the
# tags from the two.
#
# A dispatch publishes on demand, for a commit that changed nothing the
# triggers below watch:
#
#   gh workflow run ci --ref main --field image=true

on:
  # Every branch gets the gates *and* an image named after itself, so a preview
  # deployment can pull `:feature-x` and `:main` (plus `:latest`) follows main.
  #
  # What does *not* run: a commit that only touched prose. Nothing it changes is
  # compiled, tested or shipped, and the suite is eight minutes — four of the
  # last forty commits were of that kind. `:main` then keeps pointing at the
  # newest commit that changed something else: the same image, a footer that
  # names an older commit. `gh workflow run ci` publishes on demand.
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
    paths-ignore: ["**/*.md", "LICENSE"]
  # A pull request from a branch in *this* repository is already covered by the
  # push run for that branch, and those are the checks the pull request shows.
  # Only a fork has no push run here — so only a fork is checked through its
  # pull request. One run per commit, whichever door it came in by.
  pull_request:
    paths-ignore: ["**/*.md", "LICENSE"]
  workflow_dispatch:
    inputs:
      image:
        description: "Also build and publish the image, both architectures"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "29.1.2"
  # What the admin footer reports about this build. The two architectures are
  # one release built twice, so they say the same thing about the commit they
  # came from, and both build jobs read it from here rather than spelling it out
  # twice.
  IMAGE_BUILD_ARGS: |
    VERSION=${{ github.ref_name }}
    REVISION=${{ github.sha }}
    CI_PROVIDER=github
    CI_WORKFLOW=${{ github.workflow }}
    CI_RUN_NUMBER=${{ github.run_number }}
    CI_RUN_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  # No Monty checkout anywhere in this workflow. What the gates need from Monty
  # is data, and the data is checked in: `priv/monty/conf` and
  # `priv/monty/snapshots` (which revision they came from is in
  # `priv/monty/inputs.json`, written by `mix monty.inputs`).

jobs:
  # Fork pull requests only: a same-repository branch has a push run already,
  # and that run is what its pull request shows. See the trigger above.
  lint:
    name: lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Erlang/Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      # A NIF is compiled with the application, so the runner needs a Rust
      # toolchain. The script is a no-op where one is already installed.
      - run: scripts/install-rust.sh
      - run: mix deps.get
      - run: mix lint

  # `mix test --partitions 4` hands each runner a slice of the test *files*, the
  # only split that asks nothing of the tests themselves. A partition sees a
  # quarter of the lines the suite can reach, so it runs with the threshold off
  # (`COVERAGE_THRESHOLD=0`) and exports what it covered; `report` below merges
  # the four exports and holds the total to 85.
  test:
    name: test ${{ matrix.partition }}/4
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04
    # A quarter of the suite, plus the compile and the setup.
    timeout-minutes: 20
    # The results are published as a check run, which is a write to the commit
    # this run is about. A fork's pull request does not run this job at all (see
    # the `if` above), so this is a same-repository token either way.
    permissions:
      contents: read
      checks: write
    # One broken quarter still reports the other three: which quarter is the
    # question, and cancelling them is not an answer to it.
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    env:
      MIX_TEST_PARTITION: ${{ matrix.partition }}
      COVERAGE_THRESHOLD: "0"
      # The application dials `DB_PORT`, which defaults to the development
      # stack's own port. The service below is a plain 5432, so this job says so
      # rather than depending on which default a checkout happens to carry.
      DB_PORT: "5432"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Erlang/Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      # A NIF is compiled with the application, so the runner needs a Rust
      # toolchain. The script is a no-op where one is already installed.
      - run: scripts/install-rust.sh
      - run: mix deps.get

      # Run history is stored, so the suite needs its table.
      - name: Prepare the database
        run: mix ecto.create --quiet && mix ecto.migrate

      # Monty's pretrained memory is data, not source: it is downloaded and
      # exported here, by the same code a person's `/prerequisites` runs, and
      # never committed. A test that recognises an object needs it — this is a
      # checkout with nothing but what the manifest names. Both releases: v14 is
      # what the configs name, and v10 is what the recorded episodes the parity
      # tests replay were made with.
      - name: Fetch the pretrained memory
        run: mix monty.prerequisites.fetch pretrained_ycb_v14 pretrained_ycb_v10

      # This partition's share of the files, and the coverage it collected on
      # the way: `--partitions` exports it to cover/<partition>.coverdata.
      # `CI` also makes the suite write the JUnit report the next step reads.
      - run: mix test --partitions 4 --cover

      # The results, where a reviewer looks for them: one check per partition,
      # each failing test named and its line linked, and a summary of the
      # quarter's counts. `if: always()` because a failed partition is the one
      # whose results somebody needs.
      - name: Publish this partition's results
        if: always()
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          # Not `test n/4`: that is the job's own check, and two checks with one
          # name is a reviewer guessing which is which.
          name: test results ${{ matrix.partition }}/4
          path: junit/junit-${{ matrix.partition }}.xml
          reporter: java-junit
          # The check's colour follows what it says. A green check titled "3
          # failed" would be the one thing a reviewer trusts and should not.
          fail-on-error: "true"
          # A check run rather than a job summary: it is the same shape as the
          # other checks, and it annotates the failing lines.
          use-actions-summary: "false"

      # The raw report, for when a check and its XML disagree.
      - name: Keep this partition's report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-partial-${{ matrix.partition }}
          path: junit/junit-${{ matrix.partition }}.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Keep this partition's coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-partial-${{ matrix.partition }}
          # The export alone: the HTML for a quarter is not worth the bytes, and
          # the merged report generates its own.
          path: cover/${{ matrix.partition }}.coverdata
          # A partition that covered nothing is a broken split, not a green run.
          if-no-files-found: error
          retention-days: 1

  # What no single partition can answer: the coverage of the whole suite, the
  # CRAP ranking over it, and the parity oracles. Each is a total, and a total
  # of four quarters is not one of the quarters.
  report:
    name: coverage, CRAP and parity
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Erlang/Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      # A NIF is compiled with the application, so the runner needs a Rust
      # toolchain. The script is a no-op where one is already installed.
      - run: scripts/install-rust.sh
      - run: mix deps.get

      # The four exports, side by side in cover/ under the names the partitions
      # wrote — which is what both steps below expect to find there.
      - name: Collect the partitions' coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-partial-*
          merge-multiple: true
          path: cover

      # The total, held to the threshold in mix.exs: the number one local run
      # would report, because coverage does not care how it was gathered.
      - name: Coverage of the whole suite
        run: mix test.coverage

      # …and that same total as the one file `mix crap` reads.
      - name: Merge it for the CRAP ranking
        run: mix cover.merge

      - run: mix complexity

      # The parity oracles, once: they cost two seconds and do not depend on
      # which partition would have run them.
      - name: Monty config parity
        run: mix monty.config.snapshots

      - name: Module map
        run: mix monty.module_map.verify

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            cover/
            default.coverdata
          if-no-files-found: ignore
          retention-days: 14

  types:
    name: types
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Erlang/Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps, build and PLTs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-plt-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-

      # A NIF is compiled with the application, so the runner needs a Rust
      # toolchain. The script is a no-op where one is already installed.
      - run: scripts/install-rust.sh
      - run: mix deps.get
      - run: mix dialyzer

  image-amd64:
    name: image amd64, scan, non-root
    # The point of a gate is that the thing behind it cannot be reached before
    # it opens: the image is built, scanned and pushed only for a commit that
    # passed static analysis, every partition of the suite, the types, and the
    # report that merges them. A pull request is not a push, so it publishes
    # nothing.
    needs: [lint, test, types, report]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name == 'push' || inputs.image
    permissions:
      contents: read
      packages: write
    # This job's half of the index: the digest `image-index` merges, and the
    # name it tags.
    outputs:
      image: ${{ steps.image.outputs.ref }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        name: The image name
        run: |
          set -euo pipefail
          # Where this job pushes its manifest. No tag: a tag names one
          # architecture, and `image-index` is what turns the two digests into
          # the tags a deployment follows.
          echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Pushed by digest rather than loaded: the two checks below read it back
      # from the registry by that digest, which is also what the index merges —
      # so a manifest that fails either of them never stands behind a tag.
      - id: build
        name: Build linux/amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          outputs: type=image,name=${{ steps.image.outputs.ref }},push-by-digest=true,name-canonical=true,push=true
          # The commit, which the footer shows; `env.IMAGE_BUILD_ARGS` for both
          # architectures, so the two say the same thing.
          build-args: ${{ env.IMAGE_BUILD_ARGS }}
          # A scope per architecture: the two builds share one cache storage, so
          # one scope would have them evicting each other's layers.
          cache-from: type=gha,scope=image-amd64
          cache-to: type=gha,mode=max,scope=image-amd64

      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}@${{ steps.build.outputs.digest }}
          format: table
          # Only what this project can act on: a fixable OS package or library.
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"
          # Findings somebody has already read, with the reason and the date the
          # exception expires — never a blanket suppression.
          trivyignores: .trivyignore.yaml

      - name: Run as an unprivileged user
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.ref }}@${{ steps.build.outputs.digest }}"
          uid=$(docker run --rm --entrypoint /usr/bin/id "$image" -u)
          echo "image runs as uid ${uid}"
          test "${uid}" -ne 0
          test "${uid}" = "10001"

          # …and it can work like that: a read-only root filesystem, one
          # writable volume, and no root to ask for more. The studio writes
          # through `/app/bin/priv` (a symlink into that volume, which inherits
          # the image's ownership), and `HOME` and `WANDB_DIR` both point into
          # it. A volume rather than a tmpfs on purpose: a tmpfs arrives owned by
          # root, which is the deployment mistake this shape has to survive.
          docker volume create monty-contract >/dev/null
          docker run --rm --read-only --tmpfs /tmp -v monty-contract:/app/priv \
            --entrypoint /bin/sh "$image" -c '
              set -eu
              mkdir -p "$WANDB_DIR"
              touch "$HOME/home-probe"
              touch /app/bin/priv/studio-probe
              test -f /app/priv/studio-probe
              if touch /app/elsewhere 2>/dev/null; then
                echo "the root filesystem is writable; the image should need only /app/priv" >&2
                exit 1
              fi
            '
          docker volume rm monty-contract >/dev/null

      # The quickstart, as it is documented: one container, no Postgres
      # anywhere. Boot migrates, the runs live in a file on the volume, and
      # /health answers when that file does — the shape the published image is
      # meant to serve, so it is booted here rather than only described.
      - name: Runs with no database server at all
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.ref }}@${{ steps.build.outputs.digest }}"
          # No `--rm`: a container that exits takes its logs with it, and the
          # logs are the whole answer to "why did it not become healthy".
          docker volume create monty-quickstart >/dev/null
          docker run -d --name monty-quickstart -p 14001:4000 \
            -e SECRET_KEY_BASE="$(head -c 96 /dev/zero | tr '\0' x)" \
            -e SQLITE_PATH=/app/priv/data/ex_tbp_monty.db \
            -v monty-quickstart:/app/priv/data \
            "$image"
          healthy=""
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:14001/health >/dev/null; then
              healthy=yes
              break
            fi
            if [ -z "$(docker ps -q -f name=monty-quickstart)" ]; then
              break
            fi
            sleep 2
          done
          echo "--- the image's own log:"
          docker logs monty-quickstart 2>&1 | tail -60 || true
          echo "--- SQLite file on the volume:"
          docker run --rm -v monty-quickstart:/data --entrypoint /bin/ls \
            "$image" -la /data || true
          docker rm -f monty-quickstart >/dev/null || true
          docker volume rm monty-quickstart >/dev/null || true
          if [ -z "$healthy" ]; then
            echo "the image did not become healthy on SQLite" >&2
            exit 1
          fi

  # The other half, on an arm64 runner: `ubuntu-24.04-arm` is an arm64 machine,
  # so this compiles arm64 natively, which is the same work the amd64 job above
  # does in the same time. Nothing is checked here — Trivy and the uid contract
  # say the same thing about either architecture, so the amd64 job pays for them
  # once.
  image-arm64:
    name: image arm64
    needs: [lint, test, types, report]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    if: github.event_name == 'push' || inputs.image
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        name: The image name
        run: |
          set -euo pipefail
          echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - id: build
        name: Build linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          outputs: type=image,name=${{ steps.image.outputs.ref }},push-by-digest=true,name-canonical=true,push=true
          build-args: ${{ env.IMAGE_BUILD_ARGS }}
          cache-from: type=gha,scope=image-arm64
          cache-to: type=gha,mode=max,scope=image-arm64

  # The tags, made from the two manifests the builds pushed. `imagetools create`
  # only writes a list that names them, so the two architectures' bytes are
  # uploaded once, by the jobs that built them.
  #
  # Both architectures, every time. The index is what an arm64 machine pulls
  # natively, and it is not optional there: the amd64 release does not boot under
  # emulation on Apple Silicon (`{failed_to_start_child,user,nouser}` from the
  # kernel), so an amd64-only tag is an image an arm64 laptop cannot run at all.
  image-index:
    name: image index
    needs: [image-amd64, image-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'push' || inputs.image
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        name: Work out the tag
        run: |
          set -euo pipefail
          image="${{ needs.image-amd64.outputs.image }}"

          # Branch or tag name, and nothing else: `:main` moves with the
          # branch, `:v1.2.3` is the release. A commit tag would leave a new
          # image behind on every push and still not say which branch it came
          # from, so there are none — the commit is in the footer instead.
          tag=$(printf '%s' "${GITHUB_REF_NAME}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9._-]/-/g')

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "ref=${image}:${tag}" >> "$GITHUB_OUTPUT"
          # main also answers to `latest`, so a deployment can follow either the
          # branch's name or the usual one.
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "latest=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the index
        run: |
          set -euo pipefail
          image="${{ needs.image-amd64.outputs.image }}"
          tags=("${image}:${{ steps.tag.outputs.tag }}")
          if [ "${{ steps.tag.outputs.latest }}" = "1" ]; then
            tags+=("${image}:latest")
          fi

          args=()
          for tag in "${tags[@]}"; do args+=(--tag "$tag"); done
          docker buildx imagetools create "${args[@]}" \
            "${image}@${{ needs.image-amd64.outputs.digest }}" \
            "${image}@${{ needs.image-arm64.outputs.digest }}"

      # "Multi-arch" is checked rather than claimed: a release publishes an
      # index, and the one thing worth proving about it is that both
      # architectures are in it — a tag that quietly carried one platform
      # would only surface on the machine that pulled it.
      - name: The published index carries both architectures
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${{ steps.tag.outputs.ref }}" | tee /tmp/index.txt
          grep -q 'linux/amd64' /tmp/index.txt
          grep -q 'linux/arm64' /tmp/index.txt
