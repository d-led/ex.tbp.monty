name: ci

# The gates a change has to pass before it lands, and the image that comes out
# of the ones that passed:
#
#   lint   compile --warnings-as-errors, formatting, credo --strict, sobelow.
#          Fails fastest.
#   test   Postgres, the suite with coverage — split four ways, because it is
#          seven minutes fifty of an eight-minute run — and the two parity
#          oracles (Monty's config snapshots and the module map) against a real
#          Monty checkout.
#   report what the partitions cannot answer alone: their coverage merged and
#          held to the 85% threshold, the CRAP ranking over that total, and the
#          parity oracles.
#   types  dialyzer, against a PLT the cache carries between runs.
#   image  one build per architecture, each on a runner of its own
#          architecture — amd64 also runs Trivy on the result and starts it as
#          uid 10001 — and a last job that makes the tags from the two digests:
#          `:main` (and `:latest`) for main, `:<branch>` for any other branch,
#          `:v1.2.3` for a release tag. Never a commit hash — the image already
#          carries its commit in `priv/build_info.json`, which the footer shows.
#          They wait for the three gates above (`needs`), so nothing is
#          published from a commit that failed them.
#   desktop  what `scripts/run-desktop.sh` and `scripts\run-desktop.ps1`
#          download: the window with its own server inside, built on a runner of
#          the architecture it ships to, zipped by `ditto` on macOS and by `tar`
#          on Windows so executable modes and directory entries survive,
#          uploaded for ninety days — and attached to a `v*` tag as a GitHub
#          release. Only on main, tags and a dispatch: it is the longest job
#          here and nothing about a feature branch needs an app.
#
# Why two builds rather than one: compiled under QEMU on an x86 runner, the
# arm64 half took twenty-two minutes where the amd64 half took five, for the
# same work. Each pushes its manifest by digest, and `image index` makes the
# tags from the two.
#
# A dispatch publishes on demand, for a commit that changed nothing the
# triggers below watch:
#
#   gh workflow run ci --ref main --field image=true

on:
  # Every branch gets the gates *and* an image named after itself, so a preview
  # deployment can pull `:feature-x` and `:main` (plus `:latest`) follows main.
  #
  # What does *not* run: a commit that only touched prose. Nothing it changes is
  # compiled, tested or shipped, and the suite is eight minutes — four of the
  # last forty commits were of that kind. `:main` then keeps pointing at the
  # newest commit that changed something else: the same image, a footer that
  # names an older commit. `gh workflow run ci` publishes on demand.
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
    paths-ignore: ["**/*.md", "LICENSE"]
  # A pull request from a branch in *this* repository is already covered by the
  # push run for that branch, and those are the checks the pull request shows.
  # Only a fork has no push run here — so only a fork is checked through its
  # pull request. One run per commit, whichever door it came in by.
  pull_request:
    paths-ignore: ["**/*.md", "LICENSE"]
  workflow_dispatch:
    inputs:
      image:
        description: "Also build and publish the image, both architectures"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A branch's run is a step on the way to a commit, so a newer push replaces
  # it. main's is not: its desktop jobs compile a release three times over and
  # take forty minutes, and a commit that lands while they are building used to
  # cancel them — which is how the only proof that the Windows and Linux bundles
  # build can be thrown away by a one-line follow-up. main's runs finish; the
  # newest pending one replaces an older *pending* one, which GitHub does for
  # `false` as well.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "29.1.2"
  # What the admin footer reports about this build. The two architectures are
  # one release built twice, so they say the same thing about the commit they
  # came from, and both build jobs read it from here rather than spelling it out
  # twice.
  IMAGE_BUILD_ARGS: |
    VERSION=${{ github.ref_name }}
    REVISION=${{ github.sha }}
    CI_PROVIDER=github
    CI_WORKFLOW=${{ github.workflow }}
    CI_RUN_NUMBER=${{ github.run_number }}
    CI_RUN_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  # No Monty checkout anywhere in this workflow. What the gates need from Monty
  # is data, and the data is checked in: `priv/monty/conf` and
  # `priv/monty/snapshots` (which revision they came from is in
  # `priv/monty/inputs.json`, written by `mix monty.inputs`).

jobs:
  # Fork pull requests only: a same-repository branch has a push run already,
  # and that run is what its pull request shows. See the trigger above.
  #
  # A tag runs them too, and it has to: the image and the desktop release
  # `needs` these four, and a job whose needs were skipped is skipped with them —
  # a tag that built no image and no release would be worse than the duplicate
  # run it saves.
  lint:
    name: lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Erlang/Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      # A NIF is compiled with the application, so the runner needs a Rust
      # toolchain. The script is a no-op where one is already installed.
      - run: scripts/install-rust.sh
      - run: mix deps.get
      - run: scripts/build-nifs.sh
      - run: mix lint

  # `examples/example_plugin` is a project of its own, with its own lockfile, and
  # it is the one thing here that holds the plugin contract against the published
  # packages rather than against this tree. A job of its own, so that a failure
  # names the example instead of appearing inside a quarter of the suite.
  example:
    name: example plugin
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04
    # The dependency that carries the NIF is compiled here, which is most of it.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Erlang/Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            examples/example_plugin/deps
            examples/example_plugin/_build
          key: ${{ runner.os }}-example-${{ hashFiles('examples/example_plugin/mix.lock') }}
          restore-keys: ${{ runner.os }}-example-

      # The example's dependency compiles a NIF, so this runner needs Rust.
      - run: scripts/install-rust.sh
      - run: mix deps.get
        working-directory: examples/example_plugin
      - run: mix compile --warnings-as-errors
        working-directory: examples/example_plugin
      - run: mix format --check-formatted
        working-directory: examples/example_plugin
      - run: mix test
        working-directory: examples/example_plugin

  # `mix test --partitions 4` hands each runner a slice of the test *files*, the
  # only split that asks nothing of the tests themselves. A partition sees a
  # quarter of the lines the suite can reach, so it runs with the threshold off
  # (`COVERAGE_THRESHOLD=0`) and exports what it covered; `report` below merges
  # the four exports and holds the total to 85.
  test:
    name: test ${{ matrix.partition }}/4
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04
    # A quarter of the suite, plus the compile and the setup.
    timeout-minutes: 20
    # The results are published as a check run, which is a write to the commit
    # this run is about. A fork's pull request does not run this job at all (see
    # the `if` above), so this is a same-repository token either way.
    permissions:
      contents: read
      checks: write
    # One broken quarter still reports the other three: which quarter is the
    # question, and cancelling them is not an answer to it.
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    env:
      MIX_TEST_PARTITION: ${{ matrix.partition }}
      COVERAGE_THRESHOLD: "0"
      # The application dials `DB_PORT`, which defaults to the development
      # stack's own port. The service below is a plain 5432, so this job says so
      # rather than depending on which default a checkout happens to carry.
      DB_PORT: "5432"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Erlang/Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      # A NIF is compiled with the application, so the runner needs a Rust
      # toolchain. The script is a no-op where one is already installed.
      - run: scripts/install-rust.sh
      - run: mix deps.get

      # The one artefact a restored `_build` cannot be trusted with: `mix
      # compile` believes a cached tree is up to date and never reruns the
      # rustler compiler, so a tree without `priv/native/*.so` keeps every test
      # that touches the accelerators failing. See the script.
      - run: scripts/build-nifs.sh

      # Run history is stored, so the suite needs its table.
      - name: Prepare the database
        run: mix ecto.create --quiet && mix ecto.migrate

      # Monty's pretrained memory is data, not source: it is downloaded and
      # exported here, by the same code a person's `/prerequisites` runs, and
      # never committed. A test that recognises an object needs it — this is a
      # checkout with nothing but what the manifest names. Both releases: v14 is
      # what the configs name, and v10 is what the recorded episodes the parity
      # tests replay were made with.
      - name: Fetch the pretrained memory
        run: mix monty.prerequisites.fetch pretrained_ycb_v14 pretrained_ycb_v10

      # This partition's share of the files, and the coverage it collected on
      # the way: `--partitions` exports it to cover/<partition>.coverdata.
      # `CI` also makes the suite write the JUnit report the next step reads.
      - run: mix test --partitions 4 --cover
        # Named for the step after the next one, which asks whether the suite
        # was green before deciding a crashed publisher was a flake.
        id: test

      # The results, where a reviewer looks for them: one check per partition,
      # each failing test named and its line linked, and a summary of the
      # quarter's counts. `if: always()` because a failed partition is the one
      # whose results somebody needs.
      #
      # The publisher is not the suite, and it must not decide the job's colour.
      #
      # Measured over 2026-11-10, three partitions of two runs reported "520
      # passed", "673 passed" and "774 passed (1 skipped)" in their own logs while
      # their jobs were red — every one of those reds was this step. What it leaves
      # behind is a check run stuck `in_progress` with no conclusion at all, which
      # is why asking it a second time does not help: `test results 1/4` and
      # `test results 4/4` were both left open by their first attempt.
      #
      # So both attempts are allowed to fail, and a failure is said out loud in a
      # warning annotation instead. Nothing is lost when the publisher is down: the
      # partition's JUnit XML is an artifact of this run, uploaded below, and a
      # partition that produced no report at all fails there.
      - name: Publish this partition's results
        id: publish
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          # Not `test n/4`: that is the job's own check, and two checks with one
          # name is a reviewer guessing which is which.
          name: test results ${{ matrix.partition }}/4
          path: junit/junit-${{ matrix.partition }}.xml
          reporter: java-junit
          # The check's colour follows what it says. A green check titled "3
          # failed" would be the one thing a reviewer trusts and should not.
          fail-on-error: "true"
          # A check run rather than a job summary: it is the same shape as the
          # other checks, and it annotates the failing lines.
          use-actions-summary: "false"

      # `always()` is not decoration: a step `if` that names no status function
      # implies `success()`. `steps.publish.outcome` is the attempt's own result
      # even though `continue-on-error` keeps it from failing the job, so this
      # reads "the publisher failed, the suite was green".
      - name: Publish this partition's results, a second time
        id: republish
        if: always() && steps.publish.outcome == 'failure' && steps.test.outcome == 'success'
        continue-on-error: true
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: test results ${{ matrix.partition }}/4 (second attempt)
          path: junit/junit-${{ matrix.partition }}.xml
          reporter: java-junit
          fail-on-error: "true"
          use-actions-summary: "false"

      # Said rather than swallowed: a reviewer whose checks tab has no "test
      # results" entry should find out why in the run's own annotations.
      - name: Say so when the results could not be published
        if: always() && steps.publish.outcome == 'failure' && steps.republish.outcome == 'failure'
        run: |
          echo "::warning title=The test results were not published::This partition's suite ran and its report is the junit-partial-${{ matrix.partition }} artifact, but neither publish attempt completed — dorny/test-reporter left its check run open. The job's colour is the suite's, not the publisher's."

      # The raw report, for when a check and its XML disagree — and the record that
      # survives when the publisher cannot publish. A partition that produced no
      # report at all is a broken run, not a quiet one.
      - name: Keep this partition's report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-partial-${{ matrix.partition }}
          path: junit/junit-${{ matrix.partition }}.xml
          if-no-files-found: error
          retention-days: 7

      - name: Keep this partition's coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-partial-${{ matrix.partition }}
          # The export alone: the HTML for a quarter is not worth the bytes, and
          # the merged report generates its own.
          path: cover/${{ matrix.partition }}.coverdata
          # A partition that covered nothing is a broken split, not a green run.
          if-no-files-found: error
          retention-days: 1

  # What no single partition can answer: the coverage of the whole suite, the
  # CRAP ranking over it, and the parity oracles. Each is a total, and a total
  # of four quarters is not one of the quarters.
  report:
    name: coverage, CRAP and parity
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Erlang/Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      # A NIF is compiled with the application, so the runner needs a Rust
      # toolchain. The script is a no-op where one is already installed.
      - run: scripts/install-rust.sh
      - run: mix deps.get
      - run: scripts/build-nifs.sh

      # The four exports, side by side in cover/ under the names the partitions
      # wrote — which is what both steps below expect to find there.
      - name: Collect the partitions' coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-partial-*
          merge-multiple: true
          path: cover

      # The total, held to the threshold in mix.exs: the number one local run
      # would report, because coverage does not care how it was gathered.
      - name: Coverage of the whole suite
        run: mix test.coverage

      # …and that same total as the one file `mix crap` reads.
      - name: Merge it for the CRAP ranking
        run: mix cover.merge

      - run: mix complexity

      # The parity oracles, once: they cost two seconds and do not depend on
      # which partition would have run them.
      - name: Monty config parity
        run: mix monty.config.snapshots

      - name: Module map
        run: mix monty.module_map.verify

      # The version is written in three places and the tag is refused when they
      # disagree — which is how `0.1.2` sat in two files and `0.1.1` in the third
      # until someone tried to tag. One second here, and
      # `elixir scripts/release.exs bump` becomes the only way to move it.
      - name: Version
        run: elixir scripts/release.exs check

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            cover/
            default.coverdata
          if-no-files-found: ignore
          retention-days: 14

  types:
    name: types
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Erlang/Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      # `deps` is keyed by the lock file and may fall back: a change to the
      # sources fetches nothing new and reuses what it has.
      - name: Cache deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps
          key: ${{ runner.os }}-deps-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-deps-

      # A PLT is a picture of what dialyzer was handed, and what it is handed is
      # the dependencies: OTP, the hex packages, and the path dependency in
      # `packages/`. Nothing in `lib/` or `test/` is in it, so the key follows
      # the dependency sources alone — a commit that renames a module in the
      # application keeps the picture, and only a change inside `packages/` or
      # to `mix.lock` rebuilds it, which is the only case where it is wrong.
      #
      # `_build` is deliberately *not* cached here. It is what makes the
      # fallback safe: dialyxir keeps a hash of the beams the picture was made
      # from, so a restored picture that no longer matches a freshly built
      # `_build` is rebuilt by dialyxir itself. Restoring `_build` from the same
      # archive is what broke that — a cached tree that mix believes is current,
      # beside a picture made from it, agreeing with each other and disagreeing
      # with the checkout.
      - name: Cache the PLTs, keyed by the dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ hashFiles('mix.lock', 'mix.exs', 'packages/**/mix.exs', 'packages/**/lib/**/*.ex', 'packages/**/native/**/Cargo.toml', 'packages/**/native/**/Cargo.lock') }}
          # No fallback on purpose. A picture is only true of the sources that
          # made it: restoring an older one after a key miss left the previous
          # copy of `packages/` in the picture, and dialyzer then read a call to
          # a function the package had grown as a call to one that does not
          # exist (`Monty.ModuleMap.written?/1`, added while the picture was
          # warm). A miss rebuilds it, which is a minute of the job's budget and
          # the only cost of being right.

      # A NIF is compiled with the application, so the runner needs a Rust
      # toolchain. The script is a no-op where one is already installed.
      - run: scripts/install-rust.sh
      - run: mix deps.get
      - run: scripts/build-nifs.sh
      - run: mix dialyzer

  image-amd64:
    name: image amd64, scan, non-root
    # The point of a gate is that the thing behind it cannot be reached before
    # it opens: the image is built, scanned and pushed only for a commit that
    # passed static analysis, every partition of the suite, the types, and the
    # report that merges them. A pull request is not a push, so it publishes
    # nothing.
    needs: [lint, test, types, report]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name == 'push' || inputs.image
    permissions:
      contents: read
      packages: write
    # This job's half of the index: the digest `image-index` merges, and the
    # name it tags.
    outputs:
      image: ${{ steps.image.outputs.ref }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        name: The image name
        run: |
          set -euo pipefail
          # Where this job pushes its manifest. No tag: a tag names one
          # architecture, and `image-index` is what turns the two digests into
          # the tags a deployment follows.
          echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Pushed by digest rather than loaded: the two checks below read it back
      # from the registry by that digest, which is also what the index merges —
      # so a manifest that fails either of them never stands behind a tag.
      - id: build
        name: Build linux/amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          outputs: type=image,name=${{ steps.image.outputs.ref }},push-by-digest=true,name-canonical=true,push=true
          # The commit, which the footer shows; `env.IMAGE_BUILD_ARGS` for both
          # architectures, so the two say the same thing.
          build-args: ${{ env.IMAGE_BUILD_ARGS }}
          # A scope per architecture: the two builds share one cache storage, so
          # one scope would have them evicting each other's layers.
          cache-from: type=gha,scope=image-amd64
          cache-to: type=gha,mode=max,scope=image-amd64

      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}@${{ steps.build.outputs.digest }}
          format: table
          # Only what this project can act on: a fixable OS package or library.
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"
          # Findings somebody has already read, with the reason and the date the
          # exception expires — never a blanket suppression.
          trivyignores: .trivyignore.yaml

      - name: Run as an unprivileged user
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.ref }}@${{ steps.build.outputs.digest }}"
          uid=$(docker run --rm --entrypoint /usr/bin/id "$image" -u)
          echo "image runs as uid ${uid}"
          test "${uid}" -ne 0
          test "${uid}" = "10001"

          # …and it can work like that: a read-only root filesystem, one
          # writable volume, and no root to ask for more. The studio writes
          # through `/app/bin/priv` (a symlink into that volume, which inherits
          # the image's ownership), and `HOME` and `WANDB_DIR` both point into
          # it. A volume rather than a tmpfs on purpose: a tmpfs arrives owned by
          # root, which is the deployment mistake this shape has to survive.
          docker volume create monty-contract >/dev/null
          docker run --rm --read-only --tmpfs /tmp -v monty-contract:/app/priv \
            --entrypoint /bin/sh "$image" -c '
              set -eu
              mkdir -p "$WANDB_DIR"
              touch "$HOME/home-probe"
              touch /app/bin/priv/studio-probe
              test -f /app/priv/studio-probe
              if touch /app/elsewhere 2>/dev/null; then
                echo "the root filesystem is writable; the image should need only /app/priv" >&2
                exit 1
              fi
            '
          docker volume rm monty-contract >/dev/null

      # The quickstart, as it is documented: one container, no Postgres
      # anywhere. Boot migrates, the runs live in a file on the volume, and
      # /health answers when that file does — the shape the published image is
      # meant to serve, so it is booted here rather than only described.
      - name: Runs with no database server at all
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.ref }}@${{ steps.build.outputs.digest }}"
          # No `--rm`: a container that exits takes its logs with it, and the
          # logs are the whole answer to "why did it not become healthy".
          docker volume create monty-quickstart >/dev/null
          docker run -d --name monty-quickstart -p 14001:4000 \
            -e SECRET_KEY_BASE="$(head -c 96 /dev/zero | tr '\0' x)" \
            -e SQLITE_PATH=/app/priv/data/ex_tbp_monty.db \
            -v monty-quickstart:/app/priv/data \
            "$image"
          healthy=""
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:14001/health >/dev/null; then
              healthy=yes
              break
            fi
            if [ -z "$(docker ps -q -f name=monty-quickstart)" ]; then
              break
            fi
            sleep 2
          done
          echo "--- the image's own log:"
          docker logs monty-quickstart 2>&1 | tail -60 || true
          echo "--- SQLite file on the volume:"
          docker run --rm -v monty-quickstart:/data --entrypoint /bin/ls \
            "$image" -la /data || true
          docker rm -f monty-quickstart >/dev/null || true
          docker volume rm monty-quickstart >/dev/null || true
          if [ -z "$healthy" ]; then
            echo "the image did not become healthy on SQLite" >&2
            exit 1
          fi

  # The other half, on an arm64 runner: `ubuntu-24.04-arm` is an arm64 machine,
  # so this compiles arm64 natively, which is the same work the amd64 job above
  # does in the same time. Nothing is checked here — Trivy and the uid contract
  # say the same thing about either architecture, so the amd64 job pays for them
  # once.
  image-arm64:
    name: image arm64
    needs: [lint, test, types, report]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    if: github.event_name == 'push' || inputs.image
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        name: The image name
        run: |
          set -euo pipefail
          echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - id: build
        name: Build linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          outputs: type=image,name=${{ steps.image.outputs.ref }},push-by-digest=true,name-canonical=true,push=true
          build-args: ${{ env.IMAGE_BUILD_ARGS }}
          cache-from: type=gha,scope=image-arm64
          cache-to: type=gha,mode=max,scope=image-arm64

  # The tags, made from the two manifests the builds pushed. `imagetools create`
  # only writes a list that names them, so the two architectures' bytes are
  # uploaded once, by the jobs that built them.
  #
  # Both architectures, every time. The index is what an arm64 machine pulls
  # natively, and it is not optional there: the amd64 release does not boot under
  # emulation on Apple Silicon (`{failed_to_start_child,user,nouser}` from the
  # kernel), so an amd64-only tag is an image an arm64 laptop cannot run at all.
  image-index:
    name: image index
    needs: [image-amd64, image-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'push' || inputs.image
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        name: Work out the tag
        run: |
          set -euo pipefail
          image="${{ needs.image-amd64.outputs.image }}"

          # Branch or tag name, and nothing else: `:main` moves with the
          # branch, `:v1.2.3` is the release. A commit tag would leave a new
          # image behind on every push and still not say which branch it came
          # from, so there are none — the commit is in the footer instead.
          tag=$(printf '%s' "${GITHUB_REF_NAME}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9._-]/-/g')

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "ref=${image}:${tag}" >> "$GITHUB_OUTPUT"
          # main also answers to `latest`, so a deployment can follow either the
          # branch's name or the usual one.
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "latest=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the index
        run: |
          set -euo pipefail
          image="${{ needs.image-amd64.outputs.image }}"
          tags=("${image}:${{ steps.tag.outputs.tag }}")
          if [ "${{ steps.tag.outputs.latest }}" = "1" ]; then
            tags+=("${image}:latest")
          fi

          args=()
          for tag in "${tags[@]}"; do args+=(--tag "$tag"); done
          docker buildx imagetools create "${args[@]}" \
            "${image}@${{ needs.image-amd64.outputs.digest }}" \
            "${image}@${{ needs.image-arm64.outputs.digest }}"

      # "Multi-arch" is checked rather than claimed: a release publishes an
      # index, and the one thing worth proving about it is that both
      # architectures are in it — a tag that quietly carried one platform
      # would only surface on the machine that pulled it.
      - name: The published index carries both architectures
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${{ steps.tag.outputs.ref }}" | tee /tmp/index.txt
          grep -q 'linux/amd64' /tmp/index.txt
          grep -q 'linux/arm64' /tmp/index.txt

  # The window, on a runner of the architecture it ships to: the app carries a
  # compiled Python, two Rust NIFs and a webview shell, and none of them
  # cross-compile cheaply. macOS arm64 is the platform this is developed on and
  # the one whose build has been run end to end; a second platform is one
  # `include:` here plus the packages its runner needs — `docs/desktop.md` says
  # where Linux stands. Two platforms: each is built on a runner of its own
  # architecture, because the release carries a compiled Python, two Rust NIFs
  # and a webview shell, and none of them cross-compile cheaply. macOS is the
  # platform this is developed on; Windows is built and uploaded so that the
  # PowerShell scripts are answered by a runner rather than by reading them.
  desktop:
    name: desktop (${{ matrix.asset }})
    needs: [lint, test, types, report]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    # The release takes half of it; a cold Rust build of the window takes the
    # rest. Cached, a no-change run is under five minutes.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # `macos-latest`, not `macos-14`: this account's queue answers the
          # pinned label with "The configuration 'macos-14-arm64-us-default'
          # is not supported" and cancels the job a second after it is queued,
          # while the same image under `macos-latest` builds — which is how the
          # mirror's desktop release builds it.
          - os: macos-latest
            rid: osx-arm64
            asset: ex-tbp-monty-osx-arm64
            # The Tauri CLI is built from source and cached here; the images
            # ship Rust itself, so only the CLI is ever installed.
            tauri_cli: ~/.cargo/bin/cargo-tauri
            rust: scripts/install-rust.sh
            package: ./scripts/package.sh
          - os: windows-2022
            rid: win-x64
            asset: ex-tbp-monty-win-x64
            tauri_cli: ~\.cargo\bin\cargo-tauri.exe
            # The image ships Rust and the MSVC build tools; saying so fails
            # here, in one line, rather than inside `cargo build`.
            rust: cargo --version
            package: powershell -ExecutionPolicy Bypass -File scripts\package.ps1 win-x64
          - os: ubuntu-22.04
            rid: linux-x64
            asset: ex-tbp-monty-linux-x64
            tauri_cli: ~/.cargo/bin/cargo-tauri
            rust: scripts/install-rust.sh
            package: ./scripts/package.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Erlang/Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps, the desktop build and the window
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
            src-tauri/target
          key: ${{ runner.os }}-desktop-${{ hashFiles('mix.lock', 'src-tauri/Cargo.lock', 'packages/ex_tbp_monty_core/native/*/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-desktop-

      - name: Rust toolchain
        run: ${{ matrix.rust }}

      # What Tauri's Linux bundle links against: WebKitGTK for the window,
      # GTK for the shell around it, `patchelf` for the AppImage-era plumbing
      # that `.deb` packaging still runs. macOS and Windows ship these with the
      # image; Ubuntu does not, and a missing one fails at link time with a
      # sentence about `pkg-config`.
      - name: The libraries a Linux bundle links against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # No `libfuse2`: the bundler and the AppImage tools it downloads are
          # themselves AppImages, and `scripts/start-desktop.sh` sets
          # `APPIMAGE_EXTRACT_AND_RUN` for the whole chain, so none of them
          # mounts itself (`docs/desktop.md`).
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf xvfb xauth

      # A fresh runner has no `deps/`: every other job gets them from `mix lint`
      # or `mix test`, and this one compiles a different `MIX_ENV` first.
      - run: mix deps.get

      # The bundler. `cargo install` because there is no prebuilt binary, and the
      # cache keeps it from being rebuilt on every run — five minutes of Rust for
      # a tool whose output changes when the Tauri version does.
      - name: Cache the Tauri CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.tauri_cli }}
          key: ${{ runner.os }}-tauri-cli-v2

      - name: Install the Tauri CLI
        shell: bash
        run: command -v cargo-tauri >/dev/null || cargo install tauri-cli --version '^2' --locked

      # One command: the stylesheet, the scripts, `mix release`, the window with
      # that release beside it, and the portable folder and package of the result
      # in `artifacts/<platform>/`. The steps are in the script so that a laptop
      # and a runner cannot package differently — see docs/desktop.md.
      # The window's own logic, on the platform whose branches nothing else
      # compiles: `#[cfg(windows)]` — `cmd`/`call`, the separator normalising, the
      # `.bat` name — is only ever compiled by this job, and the first Windows
      # launch of this tool failed on exactly that difference ("cannot get boot
      # file"). Three tests, seconds to run, where the difference lives.
      - name: The window's own tests, on the platform its branches are for
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Windows has two PowerShells and they are not the same language: 5.1 is
      # what a person has, 7 is what this runner adds, and `run-desktop.ps1`
      # parsed in 7 while 5.1 answered "Missing closing '}'" about an `else` on
      # its own line — a one-liner that then runs for nobody. Seconds here, and
      # the version a person has is the one that decides.
      - name: The scripts parse in the PowerShell Windows has
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -NoProfile -File scripts/check-syntax.ps1
          if ($LASTEXITCODE -ne 0) { throw 'a script does not parse in Windows PowerShell 5.1' }
          pwsh -NoProfile -File scripts/check-syntax.ps1
          if ($LASTEXITCODE -ne 0) { throw 'a script does not parse in PowerShell 7' }

      - name: Package the application
        run: ${{ matrix.package }}

      # What the sibling project learned the hard way, and this one shipped three
      # times over: the release a bundle carries is the thing that can be wrong,
      # and it fails as a window that never appears. Started here without a
      # window and asked `/health`, on the platform it ships to — which for
      # Windows is the only place `cmd`, `%~dp0` and the `.bat` launcher are
      # exercised at all.
      - name: The release the bundle carries starts and answers
        shell: bash
        # A check that can hang is a check that hides: the Windows run of this
        # one printed both answers and then never ended, and the job's hour ran
        # out before anybody knew why.
        timeout-minutes: 10
        run: |
          case "${{ matrix.rid }}" in
            osx-*) release="artifacts/${{ matrix.rid }}/Monty on the BEAM.app/Contents/Resources/rel/ex_tbp_monty" ;;
            *) release="artifacts/${{ matrix.rid }}/ex-tbp-monty-${{ matrix.rid }}/rel/ex_tbp_monty" ;;
          esac
          scripts/boot-check.sh "$release"

      # The one command a person runs, run here: the script the README offers,
      # pointed at the artefacts this job has just made, stopping before it opens
      # a window. It is the only thing that tests the script's own assumptions —
      # how `nightly.link` lays the download out (two zips: the artefact, and the
      # folder zipped inside it), what the platform's unpacker does with sixteen
      # thousand files, and where the window ends up — on the platform it runs on.
      # A `.pdb` entry that bsdtar could not read made the whole download look
      # broken while everything needed had unpacked: that is the bug this catches.
      - name: The one-line download unpacks what this job built
        if: runner.os != 'Windows'
        timeout-minutes: 10
        run: |
          mkdir -p smoke
          # The wrapper nightly.link serves is the artefact the upload step
          # declares — the zip, the packages, the tarball — and not the whole of
          # `artifacts/`, which also holds the unpacked bundles that upload leaves
          # out. Python's zipfile, because GNU tar cannot write a zip at all and
          # whether an image ships `zip` is not worth betting a gate on.
          python3 - <<'PY'
          import glob, os, sys, zipfile

          root = "artifacts/${{ matrix.rid }}"
          target = os.path.join("smoke", "${{ matrix.asset }}.zip")
          uploaded = ("*.zip", "*.pkg", "*.exe", "*.deb", "*.AppImage", "*.tar.gz")
          files = [full for pattern in uploaded for full in sorted(glob.glob(os.path.join(root, pattern)))]

          if not files:
              sys.exit(f"nothing in {root} that the upload step would take")

          with zipfile.ZipFile(target, "w", zipfile.ZIP_DEFLATED) as archive:
              for full in files:
                  archive.write(full, os.path.basename(full))

          print("the wrapper holds: " + ", ".join(os.path.basename(f) for f in files))
          PY
          EX_TBP_MONTY_BASE_URL="$GITHUB_WORKSPACE/smoke" \
          EX_TBP_MONTY_DIR="$GITHUB_WORKSPACE/smoke/landing" \
          EX_TBP_MONTY_NO_LAUNCH=1 \
            scripts/run-desktop.sh
          echo "the one-line download put the application in smoke/landing:"
          find smoke/landing -maxdepth 2 | head -10

      - name: The one-line download unpacks what this job built (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          # Files only: the folder beside them is the unpacked bundle the upload
          # step leaves out, so the wrapper holds what a person downloads.
          Push-Location "artifacts/${{ matrix.rid }}"
          tar -a -c -f "$env:GITHUB_WORKSPACE/smoke/${{ matrix.asset }}.zip" `
            (Get-ChildItem -File | Select-Object -ExpandProperty Name)
          if ($LASTEXITCODE -ne 0) { throw 'the wrapper zip could not be made' }
          Pop-Location
          $env:EX_TBP_MONTY_BASE_URL = "$env:GITHUB_WORKSPACE/smoke"
          $env:EX_TBP_MONTY_DIR = "$env:GITHUB_WORKSPACE/smoke/landing"
          $env:EX_TBP_MONTY_NO_LAUNCH = '1'
          powershell -ExecutionPolicy Bypass -File scripts/run-desktop.ps1
          if ($LASTEXITCODE -ne 0) { throw 'the one-line download failed' }
          $window = "smoke/landing/${{ matrix.asset }}/ex-tbp-monty-desktop.exe"
          if (-not (Test-Path $window)) { throw "no window at $window" }
          Write-Host "the one-line download put the window at $window"

      # `ditto` and `tar` inside the scripts, not `upload-artifact`'s own zip: an
      # app bundle holds symlinks and executable modes and a release holds its
      # directory entries, and the artefact zip flattens both — the download
      # would open and then fail to start its server.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          # The zip is what `run-desktop.sh` and `run-desktop.ps1` fetch; the
          # package is what a person double-clicks (`.pkg` on macOS, the NSIS
          # setup `.exe` on Windows). The disk image is for a checkout, and
          # would be a third copy of 550 MB in every run.
          path: |
            artifacts/${{ matrix.rid }}/*.zip
            artifacts/${{ matrix.rid }}/*.pkg
            artifacts/${{ matrix.rid }}/*.exe
            artifacts/${{ matrix.rid }}/*.deb
            artifacts/${{ matrix.rid }}/*.AppImage
            artifacts/${{ matrix.rid }}/*.tar.gz
          # `run-desktop.sh` points at nightly.link, which serves the newest
          # artefact of this workflow; a week is not long enough for that
          # promise.
          retention-days: 90
          if-no-files-found: error


      # The download first, and the checks that *open* it after it — the sibling
      # project's lesson, learned by a Windows job that sat on its last step for
      # three hours with no line from it at all. `nightly.link` serves the newest
      # artifact of a *successful* run, so a check that fails or hangs does not
      # merely fail: it withholds the download for as long as it runs. There, an
      # NSIS installer launched with `/S` never returned.
      #
      # So what must be true of the build is a gate above — packaged, its release
      # answering, the download unpacking. What a person sees when they open it
      # is checked below, `continue-on-error` and with its own deadline: the step
      # can be red while the download is there. A red step nobody can act on is a
      # smaller problem than a download nobody can get.

      # The window itself, not only the release inside it. Every check above
      # asks the *server* a question, and all of them were green while the
      # window opened on nothing: this one opens the executable a person
      # downloads and waits for the page to report what it drew - the heading it
      # shows and the ids on it - to `/__painted`. Only a webview that ran the
      # page can send that report, which is the whole point of asking.
      - name: Open the window this job built
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          case "${{ matrix.rid }}" in
            osx-*) window="artifacts/${{ matrix.rid }}/Monty on the BEAM.app/Contents/MacOS/ex-tbp-monty-desktop" ;;
            win-*) window="artifacts/${{ matrix.rid }}/ex-tbp-monty-${{ matrix.rid }}/ex-tbp-monty-desktop.exe" ;;
            *) window="artifacts/${{ matrix.rid }}/ex-tbp-monty-${{ matrix.rid }}/ex-tbp-monty-desktop" ;;
          esac
          MONTY_DESKTOP_PORT=43997 scripts/smoke-window.sh --window "$window"

      # The other half of the same question, and the half nobody had ever
      # looked at: what a person sees when the app *cannot* start. Pointed at a
      # release that is not there, the window has to put up the crash screen for
      # "this copy is incomplete" - asserted in its own log, because the page is
      # inside a webview and nothing outside can read it. Without this, "the
      # window explains itself" is a claim about code nobody has watched run.
      - name: The window says what went wrong when the release is missing
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          case "${{ matrix.rid }}" in
            osx-*) window="artifacts/${{ matrix.rid }}/Monty on the BEAM.app/Contents/MacOS/ex-tbp-monty-desktop" ;;
            win-*) window="artifacts/${{ matrix.rid }}/ex-tbp-monty-${{ matrix.rid }}/ex-tbp-monty-desktop.exe" ;;
            *) window="artifacts/${{ matrix.rid }}/ex-tbp-monty-${{ matrix.rid }}/ex-tbp-monty-desktop" ;;
          esac
          MONTY_DESKTOP_PORT=43994 scripts/smoke-window.sh --window "$window" \
            --crash "/nonexistent/rel/ex_tbp_monty/bin/server"

      # The installer is the shape a Windows person actually uses, and the one
      # shape nothing had ever opened: the checks above look at the portable
      # folder, whose `rel\` is put there by `scripts/package.ps1`, while an
      # installed copy gets its `rel\` from the bundler's resource copy. A
      # download that installs and then crashes on start is exactly that
      # difference.
      - name: Install the Windows setup and open the installed window
        continue-on-error: true
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          # Anything left running by the checks above is killed first: an
          # installer that finds the app open asks a question nobody is here to
          # answer, and its answer is a hang.
          taskkill //F //IM ex-tbp-monty-desktop.exe >/dev/null 2>&1 || true

          setup=(artifacts/${{ matrix.rid }}/*-setup.exe)
          if [ ! -f "${setup[0]}" ]; then
            echo "the build made no installer to install" >&2
            exit 1
          fi

          echo "installing ${setup[0]}"
          # Bounded twice, and the bound is the lesson: an installer that waits
          # out a job says nothing at all while it waits. `timeout` names the
          # program that would not finish; the step's own deadline is the
          # backstop behind it.
          if ! timeout 300 ./"${setup[0]}" /S; then
            echo "the installer did not finish within five minutes" >&2
            exit 1
          fi

          # The install directory follows `productName` and the executable's
          # name follows the crate, so both are found rather than assumed, and
          # a package that installs nothing says so instead of timing out.
          local_app=$(cygpath -u "${LOCALAPPDATA:-$HOME/AppData/Local}")
          installed=$(find "$local_app" -maxdepth 5 -type f -iname 'ex-tbp-monty-desktop.exe' | head -1)

          if [ -z "$installed" ]; then
            echo "the installer put no window under $local_app:" >&2
            find "$local_app" -maxdepth 3 -iname '*monty*' >&2 || true
            exit 1
          fi

          echo "installed: $installed"
          ls "$(dirname "$installed")" || true
          MONTY_DESKTOP_PORT=43996 scripts/smoke-window.sh --window "$installed"

      # What a person actually downloads: the tarball, unpacked elsewhere, with
      # the release inside it started the way the window starts one. The boot
      # check above starts the staging tree `package.sh` assembled; this starts
      # the archive, which is the only shape tested on the machine it ships to.
      # The sibling project found an amd64 container on an Apple-silicon machine
      # failing this boot in OTP's `prim_tty` NIF while the staging folder
      # served - the two disagree about exactly the thing worth knowing.
      - name: The downloaded tarball's release starts
        continue-on-error: true
        if: runner.os == 'Linux'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          tar -xzf "artifacts/${{ matrix.rid }}/ex-tbp-monty-${{ matrix.rid }}.tar.gz" -C "$work"
          MONTY_DESKTOP_PORT=43995 scripts/boot-check.sh "$work/ex-tbp-monty-${{ matrix.rid }}/rel/ex_tbp_monty"
          rm -rf "$work"

      # The only copy that has left the runner. Every check above tests what this
      # job built, in place, in a folder the build wrote: an upload that drops the
      # executable bit, or an unpacker that loses a release's directory entries,
      # still ends as a download that opens and cannot start, and none of the
      # checks above can see it. So: the artefact, downloaded by name into a
      # folder this job never wrote to, unpacked with the platform's own unpacker,
      # opened. Last in the run on purpose - nothing above waits on it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.asset }}
          path: downloaded

      - name: The download a person gets opens
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/downloaded"
          # Each platform's shape, unpacked the way its own README line unpacks
          # it: `ditto` made the macOS zip, bsdtar the Windows one, and Linux
          # ships a tarball at all because a zip loses the release's 0555
          # launchers.
          case "${{ matrix.rid }}" in
            osx-*) unzip -q "${{ matrix.asset }}.zip" ;;
            win-*) tar -xf "${{ matrix.asset }}.zip" ;;
            *) tar -xzf "${{ matrix.asset }}.tar.gz" ;;
          esac

          window=$(find . -maxdepth 5 -type f \
            \( -name 'ex-tbp-monty-desktop' -o -name 'ex-tbp-monty-desktop.exe' \) \
            -print -quit)

          if [ -z "$window" ]; then
            echo "the download holds no window:" >&2
            find . -maxdepth 3 | head -20 >&2
            exit 1
          fi

          echo "unpacked from the upload: $window"
          cd "$GITHUB_WORKSPACE"
          MONTY_DESKTOP_PORT=43993 scripts/smoke-window.sh \
            --window "$GITHUB_WORKSPACE/downloaded/${window#./}"

  # A tag is a promise that the file stays: an artefact expires, a release does
  # not. One release per tag, with every asset of every tag inside it.
  desktop-release:
    name: desktop release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop]
    runs-on: ubuntu-24.04
    # The workflow's `contents: read` is for the gates; this job writes the
    # release.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach the application to the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -lh artifacts

          # A release carries the bundles and nothing else. The download is every
          # artifact of the run merged into one directory, so it also holds what
          # the gates left: the coverage *directory*, the partitions' `.coverdata`,
          # the JUnit reports, and buildkit's own `.dockerbuild` session files.
          # `artifacts/*` failed the v0.1.1 tag on the directory —
          # `read artifacts/cover: is a directory` — after attaching four
          # coverage files and nothing a person can install.
          shopt -s nullglob
          bundles=(
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.pkg
          )

          if [ "${#bundles[@]}" -eq 0 ]; then
            echo "the download holds no bundle to attach:" >&2
            ls -la artifacts >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${bundles[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${bundles[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ex.tbp.monty $GITHUB_REF_NAME" \
              --generate-notes
          fi
