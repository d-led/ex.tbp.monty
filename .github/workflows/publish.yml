name: publish

# The core package, published to Hex.
#
# A tag *is* the release: pushing `v0.1.0` publishes `ex_tbp_monty_core` 0.1.0
# and opens a GitHub release with the notes. Nothing here asks another workflow
# whether it passed — the tag is pushed by a person looking at a green main, and
# a publish job that goes hunting for a verdict is a second place for the two to
# disagree. `scripts/tag_and_push_version.sh` is the path that checks for you.
#
# The package's own suite runs here before the upload: a hex release is
# permanent, and a version number spent on a broken build can be retired but
# never withdrawn.
#
# Publishing is resumable: a version Hex already carries is skipped, so a run
# that failed half way is re-run rather than re-tagged.

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-rc.*"
      - "v*.*.*-beta.*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  ELIXIR_VERSION: "1.20.5"
  OTP_VERSION: "29.1.2"

jobs:
  publish:
    name: publish the core to Hex
    runs-on: ubuntu-latest
    permissions:
      # The package goes to Hex with a key that belongs to a person; the release
      # notes go to this repository.
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      # The crates are compiled when the package is: a NIF is loaded by the BEAM
      # of the machine that installs it, so `deps.compile` wants a Rust toolchain
      # here as much as in `ci.yml`.
      - name: Cache the Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/ex_tbp_monty_core/native/*/target
          key: cargo-${{ runner.os }}-${{ hashFiles('packages/ex_tbp_monty_core/native/**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install the toolchain the NIFs are built with
        run: rustup toolchain install stable --profile minimal --no-self-update

      # `VERSION`, the package's `@version` and the tag are three statements of
      # one number, and a tag that publishes a version nobody reviewed is what
      # this check exists to stop.
      - name: The tag and the packages agree on the version
        run: elixir scripts/release.exs check

      - name: Test, document and publish
        working-directory: packages/ex_tbp_monty_core
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          set -e
          mix local.hex --force
          mix local.rebar --force

          version=$(tr -d '[:space:]' < ../../VERSION)

          # Resumable: a package that already carries this version is left alone,
          # so a failed run is simply re-run.
          if mix hex.info ex_tbp_monty_core "$version" > /dev/null 2>&1; then
            echo "ex_tbp_monty_core $version is already published — nothing to publish"
            exit 0
          fi

          mix deps.get
          mix compile --warnings-as-errors
          # `env` rather than a `VAR=value` prefix: shellcheck reads the prefix
          # as an assignment whose value is a command, and the repo's workflow
          # lint refuses it.
          env MIX_ENV=test mix deps.get --only test
          env MIX_ENV=test mix test
          env MIX_ENV=dev mix docs
          mix hex.publish --yes

      - name: GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-rc.') || contains(github.ref, '-beta.') }}
