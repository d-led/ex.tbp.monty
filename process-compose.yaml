version: "0.5"

# Two nodes of this application on one machine, each with its own name, its own
# port and its own database file.
#
#   process-compose up
#   open http://localhost:4001 and http://localhost:4002
#
# Both pages say "2 nodes" in the footer and name both in Settings → Nodes. The
# files are separate on purpose: `nodes/node1_127.0.0.1/` and
# `nodes/node2_127.0.0.1/` under this application's data folder, each with its
# own `ex_tbp_monty.db` and its own `runs/`. What is shared is what is
# downloaded — `data/` and `models/` — because fetching a gigabyte twice would be
# the only thing worse than fetching it once.
#
# A node on its own (`mix phx.server`) is unchanged: no name, no cluster, no
# second folder.
#
# Across machines rather than one: give each node its own host (`--name
# monty1@10.0.0.7`), point `MONTY_SEEDS` at the others, and export the same
# `MONTY_COOKIE` everywhere — the cookie is the cluster's password, and nodes that
# disagree about it stay silently separate. `scripts/cluster-node.sh` passes it to
# the VM as `--cookie`, and the settings page says where a node got its own.
log_location: processes.log
log_level: debug

processes:
  node1:
    command: "scripts/cluster-node.sh node1 4001"
    working_dir: "./"
    environment:
      - "MONTY_SEEDS=node1@127.0.0.1,node2@127.0.0.1"
      # Two nodes of one machine are two nodes that can do the same things. A
      # cluster of unlike machines is where the tags matter, and this is where a
      # node declares its own (see `ExTbpMonty.Cluster.Capabilities`): uncomment
      # on one side only, and Settings → Nodes says what each one can do, and
      # who can do what.
      # - "MONTY_CAPABILITIES=gpu,world:mujoco"
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 4001
        path: "/"

  node2:
    command: "scripts/cluster-node.sh node2 4002"
    working_dir: "./"
    environment:
      - "MONTY_SEEDS=node1@127.0.0.1,node2@127.0.0.1"
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 4002
        path: "/"
