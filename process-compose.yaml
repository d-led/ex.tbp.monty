version: "0.5"

# https://f1bonacc1.github.io/process-compose/
# process-compose
#
# Two nodes of Elixir Monty Studio on one machine, each with its own name, its own
# port and its own database file.
#
#   process-compose up
#   open http://localhost:4001 and http://localhost:4002
#
# Both pages say "2 nodes" in the footer and name both in Settings → Nodes. The
# files are separate on purpose: `nodes/node1_127.0.0.1/` and
# `nodes/node2_127.0.0.1/` under this application's data folder, each with its own
# `ex_tbp_monty.db` and its own `runs/`. What is shared is what is downloaded —
# `data/` and `models/` — because fetching a gigabyte twice would be the only
# thing worse than fetching it once.
#
# **Every command here is `elixir` and `mix`, and nothing else.** No shell script:
# this file is read on Windows too, where `scripts/*.sh` does not run. A node is
# named by `--name`, which is the whole of what makes it a node; it migrates its
# own database on boot (`ExTbpMonty.Application`), because a named node owns its
# folder and nothing else can prepare it; and joining the cluster is environment.
#
# A node on its own (`mix phx.server`, no name) is unchanged: no name, no cluster,
# no second folder.
#
# ## Across machines rather than one
#
# Give each node its own host (`--name monty1@10.0.0.7`), name the others in
# `MONTY_SEEDS`, and set the **same `MONTY_CLUSTER_SECRET`** everywhere. The secret
# is the cluster's password: nodes that disagree about it stay silently separate,
# and a node that has none falls back to its user's `~/.erlang.cookie` — three
# machines have three of those. Settings → Nodes says where a node got its own.
#
# The secret is written **once**, under `vars`, and every command passes it to the
# VM as `--cookie`; `environment` below then hands the same value on, so a node
# that changes its own cookie at runtime and a node that started with it agree.
#
# Why the flag rather than only `config/runtime.exs`: that file is evaluated a
# moment *after* the VM is up, so on every start the first handshakes were refused
# — `Invalid challenge reply`, about ten seconds of it — and a cluster that was
# arriving read as a cluster that was broken. With `--cookie` the cookie is there
# before the VM compiles, before its supervision tree, and before a peer's first
# attempt.
#
# The substitution is `{{.MONTY_CLUSTER_SECRET}}` and not `$MONTY_CLUSTER_SECRET`
# on purpose: process-compose hands a command to a shell, so `$VAR` works — on
# macOS and Linux and nowhere this file claims to work. `{{.VAR}}` is
# process-compose's own substitution, which is why the same file is the same file
# on Windows.
#
# ## One runs table instead of one per node
#
# Add `DATABASE_URL=postgres://…` to both nodes and drop `MONTY_DB`: then the
# queue spreads across the nodes instead of each keeping its own (see
# `docs/cluster.md`).
#
# ## A third process that is not a studio node
#
# `example_plugin` is `examples/example_plugin`: a plugin host, which offers an
# experiment, a learning module and a motor policy to the cluster without being
# this application. It is a plain `mix` project with its own dependencies, so
# `cd examples/example_plugin && mix deps.get` once before the first `up` — a
# plugin host fetches its own packages, as anything else would.
#
# It joins with the same secret and the seeds, and Settings → Nodes files it under
# **Ex.Monty.Plugin nodes** with the tags it derived from what it registered and
# what it carries — `MontyPlugin.Capabilities` reports `monty` here because
# `ex_tbp_monty_core` is one of its dependencies, which is what the plugins'
# `needs: [:monty]` is checked against. Its
# name is on the `elixir` command line because a VM cannot be renamed after it
# starts; what it joins is the environment, which is why it can start before the
# nodes it wants and still arrive.
#
# ## A fourth process, whose decision is a simulation
#
# `flyverse_plugin` is `examples/flyverse_plugin`: a plugin host whose motor
# policy steps a real spiking connectome — flyverse's leaky integrate-and-fire
# engine, compiled into this node by Rustler. It offers
# `flyverse_plugin.lif_steering`, which decides where a sensor looks next from
# the spikes its network produced, and `flyverse_plugin.10simobj_surf_agent`,
# which is Monty's own ten-similar-objects experiment with that policy as its
# motor system. Open it by name on either studio node:
#
#   http://localhost:4001/experiments/flyverse_plugin.10simobj_surf_agent
#
# It needs a connectome, and the dataset is 150 MB and not in this repository, so
# `tmp/flyverse-pack` holds the four-neuron demonstrator. It is written once, by
# hand, and both `tmp/` and the pack survive a restart:
#
#   cd examples/flyverse_plugin
#   mix deps.get
#   mix flyverse_plugin.pack ../../tmp/flyverse-pack
#
# A pack is data, so it is not a process here: this project starts nodes, and
# `flyverse_plugin` is one process like every other. A node whose pack is missing
# still starts and refuses a policy with the sentence that names the command
# above, rather than inventing a connectome to stand in for one.
#
# ## Where the output goes
#
# Every process has its own file under `logs/`, which is ignored by git, so a
# traceback in one node is a file to read rather than a pane to scroll:
#
#   tail -f logs/node1.log                              # one process
#   tail -f logs/node1.log logs/flyverse_plugin.log      # several, by name
#   process-compose process logs node1 --follow          # the supervisor's buffer
#
# Four things about these files, all checked rather than assumed:
#
#   * a per-process `log_location` **replaces** the shared file instead of
#     copying into it — with one set for every process, a top-level
#     `log_location` stays empty, which is why there is none here any more (the
#     old `processes.log` is a leftover on disk and nothing writes to it);
#   * the directory is created if it is missing, so a fresh clone needs nothing
#     but `mix deps.get`;
#   * a file is truncated when its process starts again, so a log after a
#     restart is that run and not the run before it (verified: two starts, one
#     line each);
#   * **the file is not always written** (2026-11-14): after the cluster was
#     stopped and started, all four files were 0 bytes at 14:50–14:53 while
#     `process-compose process logs` held 30, 26, 10 and 9 lines of that very
#     start, boot lines included. So `tail -f logs/node1.log` can be a blank
#     pane that reads as a quiet node: when a process "says nothing", ask the
#     supervisor before believing it. The cause is not established — a detached
#     second supervisor does not survive this shell, so it could not be
#     reproduced in isolation — so treat the file as a convenience and the
#     buffer as the record.
log_level: debug

# The one place the cluster's password is written (see the header).
vars:
  MONTY_CLUSTER_SECRET: local-dev-secret

processes:
  node1:
    command: "elixir --name node1@127.0.0.1 --cookie {{.MONTY_CLUSTER_SECRET}} -S mix phx.server"
    working_dir: "./"
    log_location: "./logs/node1.log"
    environment:
      - "PORT=4001"
      - "MONTY_CLUSTER=true"
      - "MONTY_SEEDS=node1@127.0.0.1,node2@127.0.0.1"
      - "MONTY_DB=sqlite"
      - "MONTY_CLUSTER_SECRET={{.MONTY_CLUSTER_SECRET}}"
      # Two nodes of one machine can do the same things. A cluster of unlike
      # machines is where the tags matter, and this is where a node declares its
      # own (`ExTbpMonty.Cluster.Capabilities`): uncomment on one side only, and
      # Settings → Nodes says what each one can do, and who can do what.
      # - "MONTY_CAPABILITIES=gpu,world:mujoco"
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 4001
        path: "/"
      # A cold boot compiles, and both nodes share one `_build`: the second one
      # waits on the first one's Mix lock ("Waiting for lock on the build
      # directory"), so its endpoint is not listening for a minute or more. With
      # no delay the probe reads that as unhealthy, the supervisor sends SIGTERM,
      # `mix phx.server` shuts down **cleanly**, and the node is `Completed` — it
      # never comes back. What is left in the log is the plugins retrying the
      # handshake against a name epmd still advertises: "invalid challenge reply".
      initial_delay_seconds: 120
      period_seconds: 5
      timeout_seconds: 5
      failure_threshold: 24

  node2:
    command: "elixir --name node2@127.0.0.1 --cookie {{.MONTY_CLUSTER_SECRET}} -S mix phx.server"
    working_dir: "./"
    log_location: "./logs/node2.log"
    environment:
      - "PORT=4002"
      - "MONTY_CLUSTER=true"
      - "MONTY_SEEDS=node1@127.0.0.1,node2@127.0.0.1"
      - "MONTY_DB=sqlite"
      - "MONTY_CLUSTER_SECRET={{.MONTY_CLUSTER_SECRET}}"
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 4002
        path: "/"
      # The same patience as node1, and for the same reason: on a cold boot the
      # two nodes take turns over the Mix lock, so the probe must not read
      # "still compiling" as "unhealthy".
      initial_delay_seconds: 120
      period_seconds: 5
      timeout_seconds: 5
      failure_threshold: 24

  # Not a studio node: a plugin host, in the same cluster, from a project of its
  # own. It has no HTTP to probe and no database to migrate — it registers what it
  # offers and stays up.
  example_plugin:
    command: "elixir --name example_plugin@127.0.0.1 --cookie {{.MONTY_CLUSTER_SECRET}} -S mix run --no-halt"
    working_dir: "./examples/example_plugin"
    log_location: "./logs/example_plugin.log"
    environment:
      - "MONTY_CLUSTER_SECRET={{.MONTY_CLUSTER_SECRET}}"
      - "MONTY_SEEDS=node1@127.0.0.1,node2@127.0.0.1"

  # The pack the flyverse plugin steps is `tmp/flyverse-pack`, written once with
  # `mix flyverse_plugin.pack` (see this file's header). A connectome is data, so
  # it is not a process: the node reads the pack it was pointed at, and a missing
  # one is a refusal with a sentence, not a process to wait for.
  #
  # The second plugin host, and the only one whose decision is a spiking network:
  # `flyverse_plugin.lif_steering` steps the connectome in Rust once per step and
  # turns the sensor by what its readout neurons did. Its policy is `:owner_only`
  # — the simulation cannot leave this node — so this process is where the run's
  # motor system actually lives.
  flyverse_plugin:
    command: "elixir --name flyverse_plugin@127.0.0.1 --cookie {{.MONTY_CLUSTER_SECRET}} -S mix run --no-halt"
    working_dir: "./examples/flyverse_plugin"
    log_location: "./logs/flyverse_plugin.log"
    environment:
      - "MONTY_CLUSTER_SECRET={{.MONTY_CLUSTER_SECRET}}"
      - "MONTY_SEEDS=node1@127.0.0.1,node2@127.0.0.1"
      - "FLYVERSE_PACK=../../tmp/flyverse-pack"
