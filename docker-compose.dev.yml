# Development services only: Postgres for the app and Adminer to look inside it.
# `scripts/init-dev.sh` starts it; the application itself runs on the host with
# `mix phx.server` and needs none of this — see docs/developers.md.
#
# Both ports are published, because the application is a process on the host and
# dials the database there. They are this project's own, not the usual ones:
# 5432 and 8080 belong to whichever container started first, and on a machine
# with a second project up that is its database, which the app would then write
# into. `DB_PORT` and `ADMINER_PORT` move each end together — `config/runtime.exs`
# reads the first of them for the application.
#
# Images are pinned rather than floating: Postgres 17 is the version CI runs and
# the one the suite was written against, so bump it in .github/workflows/ci.yml
# and here together.
#
# The root docker-compose.yml is the other direction: the published image and a
# Postgres of its own, in one `docker compose up`. Its database is on the compose
# network only, because nothing outside the stack dials it.

services:
  postgres:
    image: postgres:17
    ports:
      - "${DB_PORT:-6432}:5432"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - data-postgres:/var/lib/postgresql/data

  # http://localhost:6433/?pgsql=postgres&username=postgres&db=postgres&ns=public
  # Multi-arch: no `platform:` override, so an Apple Silicon laptop runs it
  # natively instead of emulating amd64.
  adminer:
    image: adminer:latest
    links:
      - postgres
    ports:
      - "${ADMINER_PORT:-6433}:8080"

volumes:
  data-postgres:
