[package]
name = "ex-tbp-monty-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# The window's App Nap assertion (`beginActivityWithOptions:reason:` in
# `src/main.rs`). Already in the tree through wry; named here because the call is
# ours and a transitive dependency is not something to call by accident.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString"] }

[profile.release]
lto = true
codegen-units = 1
